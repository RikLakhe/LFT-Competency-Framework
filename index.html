      ["Coach a teammate through a decision using a structured approach — name the bias most likely to distort their view.","Facilitate a team decision meeting where the outcome is documented and owned — not left open.","Raise bias-awareness in the moment — name the likely bias during real team decisions.","Take ownership of the team's decision when it goes wrong — do not diffuse accountability across the team."],
      ["Describe helping a teammate make a clearer, more bias-aware decision. What did you do specifically?","Describe a team-level decision you took ownership of — not just the one who proposed it. What happened?","How do you raise bias-awareness on your team so it is a shared habit, not just your personal practice?"],
      ["Teammate coached through a decision with a specific bias identified — named instance.","Team decision facilitated and documented — with a named owner and stated outcome.","Likely bias named during real team decisions — visible in decision records."]),
    p6:L("Takes ownership of decisions made across teams. Ensures accountability is practiced throughout those teams.",
      ["Own a cross-team decision when it goes wrong — do not let accountability diffuse across teams.","Establish an accountability practice in each team you own — ADRs, post-mortems, or named owners.","Coach team leads on how to own their team's decisions rather than deferring upward.","Track decision outcomes across teams and review them in a regular retrospective."],
      ["Describe owning a cross-team decision that did not go as planned. How did you account for it?","Describe establishing an accountability practice across teams you lead. What does it require?","How do you coach team leads to own their team's decisions rather than escalating to you?"],
      ["Cross-team decision owned when it went wrong — named, with post-mortem.","Accountability practice installed in each team — ADRs or post-mortems with named owners.","Team leads coached on accountability — before/after observable change."]),
    p7:L("Takes ownership of decisions made in the engineering organization. Ensures accountability is practiced throughout the organization.",
      ["Own organization-wide decisions when they go wrong — do not attribute outcomes to circumstances.","Install an org-wide decision accountability standard — what gets a decision record, who owns the outcome, and what happens in a post-mortem.","Hold engineering leads accountable for practicing this standard on their teams.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["Describe owning an org-wide decision that did not go as planned. What was the post-mortem?","What org-wide decision accountability standard would you install? What does it require?","How do you hold engineering leads accountable for practicing this standard?"],
      ["Org-wide decision accountability standard published — with adoption measurement.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'driving-alignment',label:'Driving Alignment',levels:{
    p2:L("Contributes to conversations based on organizational strategy and principles when appropriate. Strongly oriented towards goals.",
      ["Contribute to a strategy-linked conversation when the opportunity arises — at least once per cycle.","Name the organizational goal this sprint's work tracks towards — connect the work to the goal explicitly.","Ask 'how does this connect to our goals?' when a piece of work feels disconnected.","Reference a named organizational strategy or goal in a planning conversation — not a general direction."],
      ["Describe contributing to a strategy-linked conversation. What was the organizational goal it connected to?","How do you connect your daily work to an organizational goal?","What do you do when a piece of work feels disconnected from any organizational goal?"],
      ["Strategy-linked conversation contributed to — at least one instance per cycle.","Organizational goal named explicitly in a planning artifact or standup note.","'How does this connect to our goals?' asked at least once — with a documented response."]),
    p3:L("Has conversations based on organizational strategy and principles when appropriate. Strongly oriented towards goals.",
      ["Initiate a strategy-linked conversation unprompted — do not wait for a senior to raise it.","Name the organizational goal your work tracks towards when planning it.","Ask a colleague 'does this work track towards our stated goals?' before a piece of work begins.","Reference a named organizational goal in your planning notes or retro."],
      ["Describe initiating a strategy-linked conversation — not just contributing to one. What did you say?","How do you check whether a piece of work tracks towards an organizational goal?","Show me a planning note or retro entry where you connected work to an organizational goal."],
      ["Strategy-linked conversation initiated — not just contributed to.","Organizational goal named at sprint start — in planning notes or standup.","Planning note or retro entry referencing a named organizational goal — visible in writing."]),
    p4:L("Has conversations based on organizational strategy and principles to ensure team alignment. Ensures their team is continuously working towards their shared goals.",
      ["In planning, connect the sprint goal to the organizational strategy when the link is not obvious.","Check at mid-sprint whether the team's work still tracks towards the goal — adjust if it does not.","Document the team's shared goals and the organizational strategy they serve.","Challenge work that does not connect to a shared goal — do not let disconnected work proceed without discussion."],
      ["Describe a conversation you held to ensure team alignment to an organizational goal. What did you check?","How do you verify mid-sprint that the team's work still tracks towards the goal?","Show me documentation of your team's shared goals and the strategy they serve."],
      ["Sprint goals linked to a named strategy in planning notes when the link was unclear.","Mid-sprint goal check run — with an adjustment made when the work drifted.","Team shared goals documented — linked to a named organizational strategy."]),
    p5:L("Fosters a culture within their team of having conversations based on organizational strategy and principles to create alignment.",
      ["Make strategy-linked conversations a team norm — a ritual, not just your personal habit.","Coach a teammate who plans work without referencing organizational goals to start.","Name a teammate who now initiates strategy conversations without being prompted.","Track whether team members connect their work to organizational goals without your prompting."],
      ["Describe a team ritual you introduced to make strategy-linked conversations regular.","Name a teammate who now raises strategy alignment unprompted. What did you do that influenced them?","How do you track whether the team is orienting towards goals independently?"],
      ["Team strategy-alignment ritual in place — recurring cadence with attendance.","Teammate who now raises strategy connections independently — named, with before/after observation.","Goal-orientation tracked at the team level — observable improvement across cycles."]),
    p6:L("Fosters this culture across several teams. Ensures several teams are continuously working towards their goals.",
      ["Establish a strategy-alignment norm across at least two teams beyond your own.","Work with team leads to make goal-tracking part of their sprint rituals.","Identify a team where work is disconnected from organizational goals and intervene structurally.","Track goal-orientation across teams with at least one observable indicator."],
      ["Describe a strategy-alignment norm you established across multiple teams. How did you drive adoption?","How do you help a team lead build goal-tracking into their team's sprint rituals?","How do you identify and address a team whose work has drifted from organizational goals?"],
      ["Strategy-alignment norm adopted by multiple teams — with adoption dates.","Goal-tracking ritual installed in multiple teams — with leads confirming adoption.","Drift identified and addressed structurally — documented outcome."]),
    p7:L("Fosters this culture across the organization. Ensures goals are understood and continuously worked towards across the organization.",
      ["Define an org-wide goal-alignment standard — how teams connect their work to organizational strategy and how they track progress.","Integrate the standard into the engineering planning process so it is not optional.","Hold engineering leads accountable for their team's goal-orientation.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide goal-alignment standard would you define? What does it require from each team?","How do you integrate goal-orientation into the engineering planning process so teams cannot skip it?","How do you hold engineering leads accountable for their team's alignment to organizational goals?"],
      ["Org-wide goal-alignment standard published and integrated into planning processes.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'process-thinking',label:'Process Thinking',levels:{
    p2:L("Understands their team's practices and processes.",
      ["Explain why your team's current practices exist — not just what they are.","Name one team practice you find useful and explain the problem it solves.","Name one team practice you think could be improved and explain why.","Ask a senior teammate to explain the origin of a practice you do not understand."],
      ["Walk me through your team's current practices. Why does each one exist?","Describe one team practice you find useful and one you think could be improved.","What would you do if you encountered a team practice you did not understand?"],
      ["Team practices explained with their purpose — not just their mechanics.","At least one practice identified as improvable — with a reason, not just a complaint.","Question asked to a senior about an unclear practice — with the answer documented."]),
    p3:L("Sometimes thinks about team practices and processes and discusses improvements with team.",
      ["Raise process improvement ideas with the team in retros or planning, backed by something you observed.","Write down the improvement you proposed and the team's response — do not let it stay verbal.","Distinguish what is within the team's control to change from what requires client approval.","Follow up on a process improvement you raised — check whether it was acted on."],
      ["Describe a process improvement you raised with the team. What was the outcome?","How do you distinguish what the team can change directly from what requires client approval?","What do you do when a process improvement you raised is not acted on?"],
      ["Process improvements raised with the team in writing — examples from the review period.","Improvement proposal documented — with team response noted.","Follow-up on a raised improvement — outcome recorded."]),
    p4:L("Regularly thinks about team practices and processes and discusses improvements with team.",
      ["Raise process improvements regularly in retros, each backed by an observation.","Implement process improvements you raise — not just discuss them.","Distinguish what is within the team's control to change from what requires client negotiation, and negotiate when needed.","Track whether a previously implemented improvement is still working — revisit it after one cycle."],
      ["Show me two or more process improvements you raised across this cycle.","Describe a process improvement you implemented — not just discussed. What changed?","Describe navigating a process improvement that required client approval. How did you approach the negotiation?"],
      ["Process improvement raised in multiple retros across the cycle — visible in retro notes.","Process improvement implemented — before/after observable change.","Client-negotiated process improvement — outcome documented."]),
    p5:L("Regularly discusses improvements with their team. Sometimes collaborates with others to improve organizational practices and processes.",
      ["Collaborate with another team on a shared process improvement during the review period.","Identify a practice that your client controls and propose an improvement that works within their tooling and governance constraints.","Propose a cross-team or org-level process improvement through the right channel — not just within your own team.","Follow up on a cross-team improvement to confirm it was implemented."],
      ["Describe a process improvement you collaborated on with another team. What was your role?","Describe improving a practice within a client's constraints — what could you change and what required negotiation?","Describe proposing a cross-team or org-level process improvement. Who did you involve and why?"],
      ["Cross-team process improvement — examples from the review period.","Client-constrained improvement navigated — what was changed, what was negotiated, what was worked around.","Org-level process improvement proposed — through the right channel, with a named outcome."]),
    p6:L("Thinks about practices and processes that affect several teams, discusses improvements with appropriate parties, and drives implementation.",
      ["Identify a practice that affects multiple teams and drive an improvement from proposal to implementation.","Involve the right stakeholders before proposing a cross-team change — not after.","Adapt how you introduce a process improvement to each team's context and client constraints — without diluting the standard.","Track adoption of a cross-team improvement and adjust when a team does not follow through."],
      ["Describe driving a cross-team process improvement from proposal to implementation. Who did you involve and when?","How do you adapt a process improvement to different client contexts without weakening the standard?","How do you track adoption of a cross-team process improvement?"],
      ["Cross-team process improvement driven from proposal to implementation — documented.","Stakeholders involved before the proposal — not added after resistance surfaced.","Adoption tracked and adjusted — named teams with before/after state."]),
    p7:L("Takes ownership and responsibility for organizational practices and processes and their continuous improvement.",
      ["Own the org-wide engineering practice standard — name it, publish it, and hold leads accountable to it.","Improve the standard at least once per year based on observed gaps or client feedback.","Hold engineering leads accountable for their team's adoption — by name, with a regular review.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide engineering practice standard do you own? What does it require from teams?","How do you improve the standard based on observed gaps rather than on preference?","How do you hold engineering leads accountable for their team's adoption?"],
      ["Org-wide engineering practice standard published and owned — with adoption measurement.","Standard improved at least once per year — with the gap or evidence that drove the change.","Engineering lead accountability reviews documented — at least twice per year."]),
  }},
  {id:'facilitation',label:'Facilitation',levels:{
    p2:NA,
    p3:NA,
    p4:L("Facilitates discussions within their team, ensuring that everyone has an opportunity to share their opinion and be heard, and that discussion outcomes tie to stated goals. Encourages quiet participants and ensures no one person dominates the conversation.",
      ["State the goal of the session at the start — confirm the room agrees on it.","Ask a quieter participant for their view before a decision is made — by name if needed.","Redirect a dominant speaker without dismissing their input — name a technique you would use.","Close the session with a stated outcome tied to the opening goal — not just 'we talked'.","Apply the same balanced-participation standard when client stakeholders are in the room."],
      ["Describe a team discussion you facilitated. How did you draw out a quieter participant?","What do you do when one person dominates the conversation?","How do you tie a discussion to a stated goal so the outcome is clear — not just a sense of alignment?","Describe facilitating a session with client stakeholders present. How did you keep it balanced without formal authority over them?"],
      ["Session goal stated at opening — confirmed by participants.","Quieter participant drawn in — named in meeting notes.","Dominant speaker redirected — technique used named.","Session closed with stated outcome tied to opening goal — in meeting notes.","Client-side participants included in participation balance — observed or noted."]),
    p5:L("Holds the P4 facilitation bar across a wider range of session types — retros, planning, working sessions, and client ceremonies.",
      ["Apply the P4 facilitation standard across a wider range of session types — retros, planning, working sessions, client ceremonies.","Facilitate the session types your team actually needs — retros, planning, working sessions.","Track your facilitation across the cycle — note where participation was unbalanced and what you adjusted.","Facilitate sessions with client stakeholders present where the engagement allows."],
      ["Show me the different types of sessions you facilitated this cycle.","Describe a session where participation was unbalanced. How did you notice and what did you adjust?","Describe facilitating a session with client stakeholders present. How did you keep it balanced?"],
      ["More than one kind of session facilitated during the review period.","Participation imbalance noticed and adjusted — documented in retro or self-review.","Client-stakeholder session facilitated — balanced participation evidenced in notes."]),

ms for one cycle.","Results reported with next steps.","Testing a standard on two teams first avoids a failed organisation-wide rollout.","What would you change before rolling it out further?",""]],"p7":[["Link testing to delivery","Connect testing metrics to change failure rate for one quarter.","Analysis shown to leadership.","Executives fund quality work when they see its effect on delivery.","What story do the numbers tell leadership?","f"],["Delegate the standard","Hand maintenance of the testing standard to a P6 with a review rhythm.","The P6 runs one revision without you.","Handing ownership on keeps standards alive without depending on you.","What support does the P6 still need?","fm"],["Retire a low-value rule","Find one testing rule teams follow that no longer pays off and retire or revise it.","Change published with its rationale.","Removing rules that no longer help keeps teams trusting the standard.","How did teams react to the change?","f"]]},"debugging":{"p2":[["Reproduce before fixing","For your next bug, write reproduction steps in the ticket before touching code.","A teammate can reproduce it from your steps.","If you can reproduce a bug, you can prove you fixed it.","How long did reproducing it take, and what made it hard?","f"],["Use a debugger end to end","Use breakpoints and watches to isolate one bug and note each step you took.","Notes reviewed with your mentor.","Using proper tools finds bugs faster than guessing.","What did the debugger show you that you did not expect?","fb"],["Symptom versus root cause","For one fixed bug, write the symptom, trigger and root cause in the PR.","A senior confirms the root cause is correct.","Fixing the cause, not the symptom, stops the bug from returning.","How did you know you had found the real cause?","f"]],"p3":[["Name your method","For your next 2 bugs, name the method you used (bisection, log correlation, narrowing) in the PR.","2 PRs with the method stated.","A named method makes your debugging repeatable and teachable.","Which method worked best, and why?","f"],["Bisect a regression","Use git bisect or an equivalent to find the commit behind one regression.","Culprit commit identified and fix merged.","Bisecting finds the exact change that broke something, even in a large history.","How many steps did it take to find the culprit?","fb"],["Shadow a cross-service issue","Pair with a senior on a bug that crosses services and write up how it was traced.","Write-up shared with the team.","Problems that cross services are the next level of difficulty.","What was different about tracing across services?","f"]],"p4":[["Root-cause write-up","Write a symptom, trigger and cause write-up for one production issue.","Shared in the team channel.","A clear write-up helps the team learn from one problem instead of repeating it.","Who read the write-up, and what did they take from it?","f"],["Lead a domain incident","Volunteer as technical lead for the next incident in your team's domain.","Incident resolved and you drafted the postmortem.","Leading an incident shows you can stay calm and organise others under pressure.","What was hardest about leading rather than fixing?","f"],["Write escalation triggers","Document when an issue is in your domain and when it belongs to another team.","Added to the team's onboarding docs.","Clear boundaries stop issues bouncing between teams.","Where was the boundary hardest to define?","f"]],"p5":[["Teach a live debug","Run a 30-minute walkthrough of a past incident for the team.","Session held; notes or recording saved.","Teaching debugging spreads a skill the whole team depends on.","What questions did the team ask?","f"],["Co-lead a cross-team postmortem","Co-lead a postmortem involving another team, with contributing causes per domain.","Postmortem accepted by both teams.","Shared postmortems build trust between teams instead of blame.","How did you keep it blame-free?",""],["Find a recurring cause","Review the last 5 incidents for one con 's most important user flow.","Reviewed and agreed with the team.","A service-level objective tells the team, in one number, how reliable is reliable enough.","How did you choose the target?","f"],["Share a dashboard pattern","Help another team adopt one dashboard or alert pattern.","Pattern in use on their dashboard.","Sharing what works across teams is principal-level influence.","What did the other team adapt?",""],["Cross-team observability review","Run one review with another team using their own operational data.","Review held with actions agreed.","Helping another team read its own data builds its independence.","What did they discover?",""]],"p6":[["Coverage map","Map which teams have logs, metrics, traces and alerts in place.","Map shared with leads.","A coverage map shows leadership where the blind spots are.","Which gap worries you most?","f"],["Draft one convention","Draft one org observability convention (alert naming, severity levels).","Reviewed by two leads.","Shared conventions make incidents easier to handle across teams.","Where did teams disagree?","b"],["Measure adoption","Track adoption of that convention across teams for one cycle.","Adoption reported.","Measuring adoption shows whether the convention is real or only on paper.","Why are some teams not adopting it?","f"]],"p7":[["Tie observability to MTTR","Link observability coverage to time-to-recover across teams.","Analysis presented to leadership.","Leadership invests in tools when it sees faster recovery.","What does the link between coverage and recovery show?","f"],["Delegate a section","Hand one section of the observability standard to a P6.","They revise it independently.","Delegating keeps the standard alive and grows the next architect.","What support does the P6 need?","fm"],["Tooling value review","Review observability tooling cost against value across accounts.","Recommendation sent to the VP of Engineering.","Tool spending needs to earn its value across accounts.","Which tool gives the least value for its cost?","f"]]},"understanding-code":{"p2":[["Map one request","Draw how one request flows through your service.","A senior confirms it is accurate.","Seeing the whole path of a request makes every later task easier.","What part of the flow was new to you?","f"],["Search before you write","Before your next task, search for existing logic and note what you reused.","PR notes what was reused.","Reusing existing code avoids duplicates and bugs.","What did you find that you nearly rewrote?","f"],["Explain your area","Explain the part of the codebase you work in to a newer joiner in 10 minutes.","They can find their way without you.","Explaining something proves you understand it.","What question from the newer joiner made you think?","fm"]],"p3":[["Write onboarding notes","Write onboarding notes for the part of the domain you know.","The next joiner uses them.","Notes you write today save the next joiner days.","Who has used your notes so far?","f"],["Service map before coding","For your next task, list affected services before starting.","Reviewer finds the list complete.","Knowing what a change touches avoids surprises late in the work.","Which affected service would have been easy to miss?","f"],["Become the go-to reviewer","Pick one area and review every PR in it for a sprint.","Team routes reviews in that area to you.","Becoming the go-to person in one area is the start of senior expertise.","What have you learned from reviewing every change there?","f"]],"p4":[["Domain one-pager","Write a one-page high-level description of your team's domain.","Lead confirms it is accurate.","Seeing the whole domain lets you make better decisions anywhere in it.","What part of the domain do you still find unclear?","f"],["Impact section in a spec","Add a domain-scope section to your next design doc.","It catches at least one affected service.","Spotting impact early avoids rework and incidents.","What did the impact section catch?","f"],["Meet an adjacent s avoid repeating debates.","What alternatives did you reject, and why?","f"],["Design within a constraint","Deliver a design inside a client-mandated constraint, with alternatives explored.","Design approved.","Working well inside client constraints is a core consulting skill.","What did the constraint force you to rethink?","fc"],["Flag an irreversible decision","Identify one expensive-to-reverse decision in upcoming work and flag it early.","Discussed before the build starts.","Flagging decisions that are hard to undo protects the client and the team.","Why is this decision hard to reverse?","f"]],"p5":[["Pattern rationale","Document why the chosen design pattern fits one component.","ADR merged.","Explaining why a pattern fits shows judgement, not habit.","What would make this pattern the wrong choice?","f"],["Negotiate a trade-off with the client","Lead a trade-off discussion with the client's technical stakeholders.","Outcome documented and agreed.","Agreeing trade-offs with client technical leaders is lead-level work.","What did the client care about most?","c"],["Review another team's design","Join another team's design review using consistent criteria.","Feedback given and acknowledged.","Reviewing other teams' designs builds breadth.","What did you see that they had not?",""]],"p6":[["Shared review checklist","Draft architecture review criteria two teams could share.","Reviewed by both leads.","Shared review criteria make design quality consistent across teams.","Which criterion caused the most debate?","b"],["Shared pattern adoption","Guide two teams to adopt one shared pattern.","Adopted by both teams.","Aligning teams on a pattern reduces long-term cost.","What did each team give up?",""],["Draft an org principle","Draft one org-wide architecture principle.","Reviewed by engineering leadership.","Organisation-wide principles guide decisions you will never see.","Which decision would this principle have changed?","b"]],"p7":[["Review process health check ached to the design doc.","Checking security at design time is far cheaper than fixing it later.","What did the checklist catch?","f"]],"p4":[["Threat-model a feature","Run a 30-minute threat model for one feature.","Written threat model in the design doc.","Thinking like an attacker before building prevents serious issues.","What was the scariest risk you found?","f"],["Ship a mitigation","For a vulnerability you flag, propose and ship the mitigation.","Mitigation merged.","Flagging a problem is half the job; fixing it is the other half.","How did you choose the fix?","f"],["Teach in review","Explain one security issue in context to a junior during review.","They catch a similar issue later.","Teaching in context spreads security thinking through the team.","Did the junior catch something similar later?","f"]],"p5":[["Review practice with the security team","Meet the security team to review your team's security practice.","Agreed changes documented.","Working with the security team aligns your team with company policy.","What did the security team change in your approach?",""],["Client-specific practice","Write a security practice for your client engagement.","Accepted by the client's tech lead.","A practice the client signs off builds client trust.","What did the client push back on?","c"],["Compare findings with another team","Compare security findings with another team and agree one shared fix.","Fix applied in both teams.","Learning from another team's findings prevents repeat mistakes.","What will both teams do differently?",""]],"p6":[["Caught versus escaped","Track security issues caught versus escaped across teams for a quarter.","Report shared with leadership.","Tracking what slips through shows whether security work is effective.","What does the ratio tell you?","f"],["Train one lead","Train a lead to apply the security standard without you.","They apply it independently.","Training others multiplies your impact.","What does the lead still need from you?","m"],["Contribute to org strategy","Write one section of the org security strategy.","Section accepted.","Contributing to strategy shapes how the whole organisation stays safe.","What did you propose?","b"]],"p7":[["Write the rationale","Document the reasoning behind the org security strategy.","Published alongside the strategy.","Explaining the why lets others defend the strategy without you.","Which reason was hardest to explain?","fb"],["Hunt non-obvious threats","Run a review of one system specifically for non-obvious threats.","Findings logged with mitigations.","Non-obvious threats are the ones that cause the worst incidents.","How did you look for what others missed?",""],["Name a co-owner","Make the strategy survive you by naming and coaching a co-owner.","Co-owner leads one revision.","A named co-owner means the strategy survives leadership changes.","How are you preparing the co-owner?","fm"]]},"ai-assisted":{"p2":[["Log what you changed","On your next 3 AI-assisted PRs, note what the AI suggested and what you changed.","3 PRs carry the note.","Knowing what you changed shows you are in control of the AI, not the reverse.","What did the AI get wrong?","fb"],["Confirm approved tools","Confirm and record which AI tools your client allows.","Record saved in the project docs.","Using unapproved tools on client code can breach the contract.","Which tools are allowed, and how did you find out?","fc"],["Write a prompt template","Write a reusable prompt template for one task you repeat.","Template reviewed with your mentor.","Reusable prompts save time and give consistent results.","How much time does the template save?","fb"]],"p3":[["Client-data stripping checklist","Make a checklist for removing client data from prompts and use it for a sprint.","Checklist in use; no client data in prompts.","Client data in AI tools can breach contracts and trust.","Which item on the checklist is easiest to forget?","fb"],["Spec before the agent","Write a short spec before one nablement lead","Train a lead to run AI enablement on their team.","They run it without you.","Training leads multiplies your impact.","What does the lead still need from you?","m"],["Own a standard section","Take ownership of one section of the org AI standard.","Section revised under your name.","Owning a section builds organisation-level accountability.","What will you change first?","b"]],"p7":[["Usage versus outcome audit","Check whether AI adoption is being measured by usage or outcomes.","Findings shared with leadership.","Usage numbers can look good while outcomes get worse.","What did the audit reveal?","f"],["Document an accountability case","Document one case where a team was held to the standard.","Case recorded with outcome.","Real accountability cases make the standard credible.","What happened when the team was held to it?","fm"],["Review the standard","Run the twice-yearly review of the org AI standard.","New version published.","Regular reviews keep the standard current as tools change fast.","What changed most since last time?","f"]]},"ai-judgment":{"p2":[["Catch a wrong suggestion","Find and record one AI suggestion that was wrong (a made-up API, broken logic).","Shared and discussed with your mentor.","AI can be confidently wrong, so spotting it early protects quality.","How did you notice it was wrong?","fb"],["Verify with tests","For one AI-generated function, write tests that verify its behaviour before committing.","Tests merged with the function.","Tests turn 'looks right' into 'proven right'.","Did the tests find anything?","fb"],["Five-case eval","Write a 5-case eval for a simple prompt. A practice project is fine.","Eval covers normal, edge and failure cases.","Evals are how you test AI behaviour that is never exactly the same twice.","Which case was hardest to write?","fb"]],"p3":[["Document a prompt refinement","Record one prompt before and after refinement, and why it improved.","Refinement noted in the PR.","Refining prompts deliberately is a repeatable skill, not luck.","What made the second prompt better?","fb"],["Eval for a component","Write an eval set for one AI component.","At least 5 cases committed.","An eval set lets the team change AI features safely.","Which case failed first?","fb"],["Draft a rollback condition","For an AI feature (real or practice), write a rollback condition: metric, threshold, owner.","Reviewed by a senior.","A rollback plan means problems in production do not become crises.","Who would act on this, and how fast?","fb"]],"p4":[["Coverage statement","Write what your eval suite covers and what it does not.","Statement committed with the eval.","Being honest about what evals miss is what builds trust in them.","What risk is still uncovered?","f"],["Model choice with numbers","Compare two models on cost, latency and quality for one feature.","Comparison recorded with the decision.","Choosing models with numbers avoids expensive guesses.","What did the comparison change?","b"],["Review an AI PR for evals","Review a teammate's AI PR for eval coverage and rollback readiness.","Specific feedback given and addressed.","Reviewing others' AI work spreads good practice.","What did the teammate change?","f"]],"p5":[["Feed failures into evals","Add every production AI failure from the last month to the eval set.","Eval set updated within a sprint.","Real failures make the best test cases.","Which failure surprised you most?","f"],["Stakeholder feature brief","Write a one-page brief explaining an AI feature's probabilistic behaviour to non-technical stakeholders.","Client stakeholder confirms they understand it.","Non-technical stakeholders need to understand that AI can vary.","How did the stakeholder react?","c"],["Check another team's AI features","Review another team's AI features for missing evals or rollback plans.","Gaps shared with their lead.","Spotting gaps in other teams' AI work prevents shared incidents.","How did the other lead respond?",""]],"p6":[["First quality n point identified.","Spotting where untrusted input enters is the first step to defending it.","Why is that the risky spot?","fb"]],"p3":[["Note vectors in your PR","In your next AI PR, list each injection vector considered.","PR description includes the list.","Listing risks in the change makes reviewers check them.","Which vector was easiest to miss?","f"],["Three risks with code","Prepare a code example for each of the three main AI security risks.","Examples explained to a senior.","Concrete examples make risks real for the whole team.","Which example was hardest to build?","fb"],["Scope one tool permission","Write a permission scope for one tool or MCP server.","Scope reviewed and applied.","Limiting what tools can do limits the damage if something goes wrong.","What permission did you remove?","fb"]],"p4":[["Sanitise retrieved content","Add validation for retrieved or tool content before it enters model context.","Change merged with tests.","Checking content before the AI sees it blocks many attacks.","What would have got through before?","f"],["Gate destructive commands","Require human approval for delete, push and infrastructure commands in one agent config.","Config merged.","Human approval stops an AI agent from doing irreversible damage.","Which command worried you most?","fb"],["Mini threat model","Write a short threat model for one AI feature.","Attached to the design doc.","Thinking through threats early is far cheaper than fixing incidents.","What was the biggest risk?","f"]],"p5":[["Refresh the team standard","Review and update the team AI security standard.","Updated version published.","A current standard keeps the whole team safe as AI tools change.","What was out of date?","f"],["Threat-model high-risk features","Threat-model every team AI feature that takes untrusted input or has tool access.","Threat models filed.","Features that take untrusted input are where AI attacks happen.","Which feature carries the most risk?",""],["Compare with another team","Compare AI security practice with another team and agree one improvement.","Improvement applied.","Comparing with another team spreads good defences.","What will both teams do differently?",""]],"p6":[["Evidence a recurring gap","Collect evidence of one AI security gap that recurs across teams.","Evidence shared with leads.","Evidence of a repeated gap justifies a structural fix.","How often does it recur?","f"],["Reconcile interpretations","Turn two leads' differing readings of the standard into one written interpretation.","Both leads agree.","One clear interpretation stops teams applying the rules differently.","Where did the leads differ?","m"],["Add AI to the security review","Get AI-specific risks into the org security review.","Item added with a named owner.","Getting AI into the security review makes it part of normal governance.","Who owns it now?",""]],"p7":[["Review the exception log","Review AI security exceptions for patterns.","Findings and standard changes published.","Exceptions show where the standard does not fit reality.","What pattern did you find?","f"],["Map to client contracts","Map the AI security standard to one client's contract clauses.","Mapping recorded for that client.","Mapping to contracts proves compliance to the client.","Which clause was hardest to map?","c"],["Hand off enforcement","Coach a P6 to run exception handling.","They handle exceptions independently.","Handing on enforcement grows the next owner.","What does the P6 still find hard?","fm"]]},"work-breakdown":{"p2":[["Split one task","Split your next task into pieces of one day or less before starting.","Subtasks listed in the ticket.","Small pieces ship sooner and show progress every day.","Which piece was hardest to separate?","fbm"],["Write acceptance criteria","Write acceptance criteria for a task before starting and confirm them with your lead.","Criteria agreed in the ticket.","Clear criteria mean you know when you are done.","What changed after your lead reviewed them?","fm"],["Flag a task that is too big","In planning, flag one task as too large and explain why.","Task resized.","Speaking up about size early prevents late surprises.","How did the team respond?","fm"]],"p3":[["List dependencies up front","List dependencies on your next 3 tickets before starting.","3 tickets show dependencies.","Knowing dependencies up front avoids getting stuck mid-task.","Which dependency would have blocked you?","fm"],["Deploy-sized for a sprint","Size every task you own so each ships within one deploy cycle, for a full sprint.","Sprint board shows it.","Small, shippable tasks make delivery predictable.","What was hardest to keep small?","f"],["Help a teammate split","Help a P2 split a task that is too large.","Their task ships in smaller pieces.","Helping others plan multiplies your impact.","What did the P2 learn?","fm"]],"p4":[["Grooming pass","Review upcoming sprint tickets and resize any that are too large.","Resized tickets noted.","Catching oversized work before the sprint protects the team's commitments.","Which ticket was most misleading?","fm"],["Draft an epic breakdown","Draft the task breakdown for one epic.","Lead reviews and uses it.","Breaking down an epic is the step toward leading delivery.","What did your lead change?","f"],["Plan for parallel work","Arrange an epic's tasks so 3+ people can work in parallel.","No blocking hand-offs in the sprint.","Parallel work lets the team move faster without stepping on each other.","Where were the hand-offs hardest to remove?","f"]],"p5":[["Epic goal check","Ask 3 teammates to state the epic goal and fix any gaps.","Everyone states it the same way.","A shared understanding of the goal prevents wasted work.","Whose answer surprised you?","fm"],["Cross-team breakdown","Help break down one piece of work that spans two teams.","Both teams agree the split.","Splitting work across teams is principal-level coordination.","Where did the teams disagree?","m"],["Shared tracker","Set up shared tracking for cross-team work.","Both teams use it weekly.","Shared tracking keeps teams aligned without extra meetings.","Is it still being used?","fm"]],"p6":[["Review a roadmap item","Review one roadmap item's breakdown before teams start.","Issues fixed before work starts.","Fixing breakdown before work starts saves weeks later.","What issue did you catch?","fm"],["Map sequencing","Map sequencing dependencies for one initiative.","Map shared with all teams.","Getting the order right avoids teams waiting on each other.","Which dependency was hidden?","fm"],["Propose a breakdown gate","Propose a lightweight check that stops unbroken-down work entering sprints.","Proposal reviewed by leadership.","A light check stops the same problem recurring.","How will you keep it lightweight?","bm"]],"p7":[["Measure breakdown quality","Pick one indicator of breakdown quality and baseline it.","Baseline reported.","Measuring quality shows whether the process works.","What does the baseline show?","fm"],["Install the gate","Roll out the breakdown check across teams.","In use by all teams.","An organisation-wide check makes good practice the default.","Where is adoption weakest?","m"],["Coach a P6","Coach a P6 to run roadmap breakdown reviews.","They run one alone.","Coaching a successor spreads the skill.","What does the P6 still need?","fm"]]},"prioritisation":{"p2":[["Ask why it is top","Ask your lead why the top ticket is the top priority and note the answer.","You can explain the priority order.","Understanding why work matters helps you make good calls later.","What did you learn about how priorities are set?","fbm"],["Same-day blockers","For one sprint, raise every blocker on the day you hit it.","No blocker waits overnight.","Raising blockers quickly keeps the team moving.","How did it feel to raise them straight away?","fm"],["Suggest a reorder","Suggest one priority change with a reason.","Discussed with your lead.","Questioning priorities respectfully shows engagement.","How did your lead respond?","fm"]],"p3":[["Record dependencies","Record every dependency in the ticket before starting work.","All your tickets show dependencies.","Visible dependencies help the whole team plan.","Which dependency mattered most?","fm"],["Communicate a delay early","Communicate one dependency-caused delay on the day you see it.","Lead hears before the date is missed.","Early warnings let the team adjust before deadlines slip.","How did your lead use the warning?","fm"],["Pre-planning scan","Scan the next sprint for dependencies before planning.","Findings raised in planning.","Spotting dependencies before planning makes planning faster.","What did you find?","fm"]],"p4":[["Correct one priority","Correct one mis-prioritised task before the sprint starts, with reasoning.","Correction recorded in sprint notes.","Fixing priorities early protects the team's focus.","How did you decide it was wrong?","fm"],["Raise a risk early","Raise one dependency risk before it delays the sprint.","Risk handled without slipping.","Raising risk early is what makes seniors reliable.","What happened because you raised it early?","fm"],["Epic-level dependency review","Run a dependency review at the epic level.","Dependency map produced.","Epic-level dependencies are where delivery usually breaks.","What did the map reveal?","f"]],"p5":[["Link sprint to strategy","Make the link between sprint priorities and org strategy explicit in planning.","Link visible in planning notes.","When the team sees why work matters, it makes better trade-offs.","How did the team react to the link?","fm"],["Cross-team dependency doc","Write a shared dependency document with another team.","Both teams use it.","A shared document prevents two teams assuming different things.","Where were the assumptions different?","fm"],["Cross-team dependency session","Facilitate a session to confirm all teams understand shared dependencies.","Session held with actions.","Getting teams in one room surfaces conflicts early.","What conflict came up?","m"]],"p6":[["Initiative dependency map","Map dependencies for one major initiative.","Map shared before work starts.","Mapping big initiatives prevents expensive surprises.","What surprised you on the map?","fm"],["Fix a recurring pattern","Fix one dependency problem that keeps recurring.","No repeat over two cycles.","Fixing the root of a repeat problem saves every future project.","How do you know it is fixed?","m"],["Status cadence","Start a regular dependency status update for stakeholders.","Running on a fixed cadence.","Regular updates keep stakeholders confident.","What do stakeholders ask about most?","fm"]],"p7":[["Measure dependency delays","Measure delays caused by dependencies across the org.","Baseline reported.","Measuring delays shows where the organisation loses time.","Where are the biggest delays?","fm"],["Preventive process","Install one process that prevents a repeat dependency blocker.","Before and after data shows fewer delays.","Prevention is cheaper than firefighting.","What has changed since the process started?","m"],["Coach a P6","Coach a P6 to own org dependency mapping.","They produce the next map.","Coaching a successor spreads the skill.","What does the P6 still need?","fm"]]},"ambiguity":{"p2":[["Decide a small thing","On a small task with an open question, propose a decision and write down your assumption.","Lead agrees or adjusts it.","Making small decisions builds the confidence to make bigger ones.","What did you assume, and was it right?","fbm"],["Waiting log","For one sprint, note every time you waited to be told what to do. Turn one into a decision.","One decision made from the log.","Seeing when you wait helps you become more independent.","What stopped you deciding sooner?","fbm"],["Assumption in the PR","Write the assumption behind one decision in your PR.","Reviewer can see the reasoning.","Writing assumptions down makes your thinking visible and correctable.","Did anyone challenge the assumption?","fm"]],"p3":[["Decision record","Record one decision you made without the full picture, with assumptions.","Record saved.","A record shows good judgement even when the outcome is uncertain.","What would you do differently now?","fm"],["Revisit when wrong","When an assumption fails, update the decision and record why.","Revision noted.","Changing course on new facts is a strength, not a failure.","How did others react to the change?","fm"],["Decide under time pressure","Make one in-scope decision under time pressure with a senior on standby.","Decision held up.","Deciding under pressure, safely, builds senior-level confidence.","What made it feel risky?","fm"]],"p4":[["Write before acting","In a high-pressure situation, write the decision and rationale before acting.","Record exists.","Writing first keeps decisions calm and explainable.","Did writing it change the decision?","fm"],["Know-now versus learn-later","For one unclear requirement, split what the team must know now from what it can learn later.","Team starts without waiting.","Separating must-know from can-learn keeps teams moving.","What did the team learn after starting?","fm"],["Set revisit triggers","Document the conditions that would reopen a decision.","Triggers noted in the record.","Clear triggers stop decisions being reopened without reason.","Has a trigger fired yet?","fm"]],"p5":[["Unstick the team","Guide the team to a decision when requirements are incomplete.","Delivery continues on schedule.","Keeping a team moving through uncertainty is core lead work.","What helped the team commit?","fm"],["Shared decision across teams","Resolve one ambiguity that affects another team with a shared decision record.","Both teams follow it.","One shared decision stops two teams diverging.","How did the other team respond?","m"],["Governance or knowledge gap","Classify one recurring ambiguity as a governance gap or a knowledge gap and propose a fix.","Fix agreed.","Knowing the type of gap tells you the right fix.","Why did you classify it that way?","fbm"]],"p6":[["Stop duplicate decisions","Find an ambiguity several teams are solving separately and resolve it once.","One record replaces several.","Solving an ambiguity once saves effort across teams.","How many teams were affected?","fm"],["Verify adoption","Check that teams actually follow a shared decision.","Adoption confirmed or corrected.","A decision only matters if teams actually follow it.","Who was not following it, and why?","fm"],["Recurring ambiguity process","Propose a process for a recurring kind of uncertainty.","Process reviewed.","A process for recurring uncertainty saves leadership time.","Who would run the process?","bm"]],"p7":[["Org-level decision","Write one org-level decision specific enough that teams do not re-decide it.","No team-level re-decisions.","Clear organisation-level decisions let teams move fast.","How do you know teams are not re-deciding?","fm"],["Install the process","Make the recurring-ambiguity process standard.","In use across teams.","Standard processes scale beyond any one leader.","Where is adoption weakest?","m"],["Coach a P6","Coach a P6 to resolve a cross-team ambiguity.","They do it without you.","Coaching a successor spreads the skill.","What does the P6 still find hard?","fm"]]},"reliability":{"p2":[["Three-part standup","For a week, give standup updates as task, current state and next action.","Lead confirms updates are clear.","Clear updates help the team plan around your work.","What feedback did you get on your updates?","fm"],["Flag risk before the deadline","Raise one at-risk commitment before its deadline.","Lead hears early.","Early warnings build trust even when things slip.","How did your lead respond?","fm"],["Estimate versus actual","Track estimate against actual for your tasks for a sprint.","Pattern discussed in a 1:1.","Seeing your estimate patterns makes you more predictable.","Do you usually over- or under-estimate?","fbm"]],"p3":[["Commit realistically","Compare what you committed to and what you delivered over 2 sprints, then adjust.","Ratio improves or holds.","Realistic commitments make you dependable.","What made you overcommit before?","fm"],["Revise estimates early","Send a revised estimate before the original deadline.","Revision sent on time.","Revising early is professional; missing silently is not.","How did your lead use the revised estimate?","fm"],["Flag cost growth","Raise one case of work growing beyond its estimate on the day you notice.","Lead notified the same day.","Spotting growing work early protects budgets and margin.","What caused the growth?","fm"]],"p4":[["Risk before blocker","Spot one risk to a commitment before it blocks you.","Handled without escalation.","Seeing risk before it becomes a problem is a senior trait.","What signal did you notice?","fm"],["Self-correct mid-sprint","Adjust your own scope mid-sprint when behind, before review.","No surprise at sprint review.","Adjusting yourself shows ownership.","What did you drop or defer, and why?","fm"],["Run a team risk review","Run a short risk review at sprint start.","Risks listed with owners.","A short risk review keeps the team ahead of problems.","Which risk turned out to be real?","fm"]],"p5":[["Expectations document","Write an expectations document with an external stakeholder before work starts.","Stakeholder agrees in writing.","Written expectations prevent scope disputes with clients.","What did the stakeholder push back on?","fmc"],["Weekly plan versus actual","Track team cost and delivery against plan weekly for a month.","Deviations flagged early.","Regular tracking catches drift while it is small.","What drift did you catch?","fm"],["Cross-team commitment","Track one commitment shared with another team.","Delivered as agreed.","Delivering on a cross-team promise builds trust between teams.","What nearly got in the way?","m"]],"p6":[["Weekly shared roadmap","Keep a shared cross-team roadmap updated wee reakdown, team risk and stakeholder expectations; delivery is predictable.","Team delivers, but the EM still handles stakeholder risks."],"fcc":["Has built team habits (feedback, knowledge sharing) that run without them.","Models good behaviour personally, but no team habit has formed."],"leadership":["Coaches teammates through decisions; owns team decisions publicly, including misses.","Decides well for the team but does not grow others' judgement."],"strategic":["Shapes the roadmap with the client's product team and simplifies designs for a business reason.","Gives roadmap feedback but does not shape it."]},"p6":{"technical":["Shared patterns or libraries adopted by at least two teams; solves hard cross-team problems hands-on.","Influential in own team; cross-team work is advisory only."],"delivery":["Cross-team dependencies and commitments run through a shared roadmap; delays surface early.","Helps across teams when asked but does not own cross-team delivery."],"fcc":["Norms they introduced are adopted by other teams, with leads coached through them.","Respected across teams, but no lasting norms."],"leadership":["Owns cross-team decisions; leads on other teams now own theirs.","Facilitates well, but decisions still escalate to them."],"strategic":["Refines roadmaps across teams and is the client's trusted technical advisor on product decisions.","Strong account knowledge, but advice stays within one team."]}},"time_in_level":[["P2 → P3","about 12 months"],["P3 → P4","12–18 months"],["P4 → P5","18–24 months"],["P5 → P6","24 months or more"]]};
function growthGoal(lvId){return lvId==='p6'?'deeper P6 scope':lvId==='p7'?'P7 mastery':nextCode(lvId)}
function nextCode(lvId){const i=LEVELS.findIndex(l=>l.id===lvId);return LEVELS[i+1]?LEVELS[i+1].code:null}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function passes(t){const fl=t[5];return S.ff.every(f=>f==='noc'?!fl.includes('c'):fl.includes(f));}
function tagsHtml(fl,lvId){
  const senior=['p5','p6','p7'].includes(lvId);
  const meta=[fl.includes('f')?'Fits in normal work':'Needs time set aside',fl.includes('b')?'<span class="ok">Works without a project</span>':'Needs a project','Coach: '+(fl.includes('m')?'people manager':(senior?'principal or architect':'tech lead'))];
  return `<div class="gt-meta">${meta.join(' · ')}</div>${fl.includes('c')?'<div class="tag warn">Client-facing: check with account lead</div>':''}`;
}
function taskCard(t,i,lvId){
  const k=GKIND[i];const nx=nextCode(lvId);
  return `<div class="gt${i===3?' is-bench':''}"><div class="gt-kind ${k.cls}">${k.label}<span class="gt-time">${k.time}</span></div>
    <h4>${esc(t[0])}</h4>
    <p>${esc(t[1])}</p>
    <p class="why">${esc(t[3])}</p>
    <dl class="box"><div><dt>Done when</dt><dd>${esc(t[2])}</dd></div><div><dt>Ask in 1:1</dt><dd>${esc(t[4])}</dd></div></dl>
    ${tagsHtml(t[5],lvId)}
  </div>`;
}

const GUIDE_HTML=`<div class="guide">
<div><h2>How to use this framework</h2><p>A reference for what each level looks like at LFT, for growth conversations between engineers and their managers.</p></div>

<div class="gsec"><h3>Document control</h3>
<div class="tbl-wrap"><table style="min-width:0"><tbody>
<tr><td>Status</td><td>Released as v2.0 on 26 Oct 2026.</td></tr>
<tr><td>Owner</td><td>VP of Engineering</td></tr>
<tr><td>Content steward</td><td>One P6 or P7 nominated by the owner, maintaining rubrics, growth tasks and kits</td></tr>
<tr><td>AI competencies</td><td>Reviewed every quarter by the AI practice lead</td></tr>
<tr><td>Framework review</td><td>Every 6 months</td></tr>
<tr><td>Effective date</td><td>26 Oct 2026</td></tr>
</tbody></table></div>
<p style="margin-top:10px"><strong>Rollout</strong></p>
<ol>
<li>Manager training (90 minutes): ratings, evidence and growth tasks.</li>
<li>Engineer FAQ and an all-hands walkthrough.</li>
<li>Calibration session with managers.</li>
<li>Retrospective after the first cycle; changes go into the next version.</li>
</ol>
<p style="margin-top:10px"><strong>How we will know it works:</strong> ratings consistent across managers, engineers who can explain what their next level looks like, and regretted attrition at P4–P6.</p></div>

<div class="gsec"><h3>AI fluency</h3>
<p>The three AI competencies follow the overview of the <strong>AI Fluency Matrix</strong>. Expectations at each level use its wording.</p>
<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Theme</th><th>Competency here</th><th>Applies to</th></tr></thead><tbody>
<tr><td>PF8</td><td>AI-Assisted Engineering: how engineers use AI tools safely and well in everyday delivery work</td><td>Every engineer</td></tr>
<tr><td>PF9</td><td>AI Engineering: how engineers build, evaluate and ship features that call LLMs</td><td>Only engineers who work on AI features</td></tr>
<tr><td>PF10</td><td>AI Security Engineering: how engineers protect AI features from injection, data leakage and unsafe agent autonomy</td><td>Every engineer</td></tr>
</tbody></table></div>
<p style="margin-top:8px"><strong>Overall anchor by level</strong></p>
<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Level</th><th>Keyword</th><th>Focus</th></tr></thead><tbody><tr><td>P2</td><td>Verifies / Learns</td><td>Executes and validates under senior guidance; reviews outputs line by line.</td></tr><tr><td>P3</td><td>Systematises</td><td>Applies repeatable prompting patterns, writes specs before prompting, and builds basic components.</td></tr><tr><td>P4</td><td>Integrates</td><td>Full-lifecycle integration, disciplined context and session management, and infrastructure evaluation.</td></tr><tr><td>P5</td><td>Standardises</td><td>Establishes team-level AI standards, prompt conventions, and evaluation suites.</td></tr><tr><td>P6</td><td>Spreads</td><td>Drives adoption, closes AI practice gaps, and sets benchmarks across multiple teams.</td></tr><tr><td>P7</td><td>Governs</td><td>Sets organisational AI governance, policy, business-outcome metrics, and security posture.</td></tr></tbody></table></div>
<p style="margin-top:8px"><strong>Keyword by theme</strong></p>
<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Level</th><th>PF8</th><th>PF9</th><th>PF10</th></tr></thead><tbody><tr><td>P2</td><td>Verifies</td><td>Contributes</td><td>Recognises</td></tr><tr><td>P3</td><td>Systematises</td><td>Catches</td><td>Identifies</td></tr><tr><td>P4</td><td>Integrates</td><td>Ships</td><td>Applies</td></tr><tr><td>P5</td><td>Standardises</td><td>Reviews</td><td>Standardises</td></tr><tr><td>P6</td><td>Spreads</td><td>Standardises</td><td>Harmonises</td></tr><tr><td>P7</td><td>Governs</td><td>Governs</td><td>Governs</td></tr></tbody></table></div>
<p style="margin-top:8px"><strong>Assessment principles</strong></p>
<ul>
<li><strong>A bar, not a checklist:</strong> an engineer meets the bar by showing most of the bullets. Equivalent evidence counts, and numbers are defaults that calibration can adjust.</li>
<li><strong>Project context:</strong> mark items N/A when the project rules them out, and accept evidence from internal work, a sandbox exercise or a previous engagement.</li>
<li><strong>Same themes, different depth:</strong> AI awareness, AI-assisted development and security basics are expected at every level. Depth and reach change with seniority, not the subject.</li>
</ul></div>

<div class="gsec"><h3>Rating scale</h3>
<table><thead><tr><th>Rating</th><th>Meaning</th></tr></thead><tbody>
<tr><td>Meets</td><td>Meets the expectation for the level, consistently and independently, across the review period. This is the standard everyone is measured against.</td></tr>
<tr><td>Below</td><td>Does not meet the expectation for the level.</td></tr>
<tr><td>Exceeds</td><td>Goes beyond the expectation for the level.</td></tr>
<tr><td>N/A</td><td>Not applicable for this person, for example a competency their role or project gives no chance to show. Never counted against the engineer.</td></tr>
</tbody></table></div>
<div class="gsec"><h3>Definitions</h3>
<ul>
<li><strong>Team</strong> — one delivery squad (typically 4–8 engineers) on a single client account or internal product, with one tech lead.</li>
<li><strong>Several teams</strong> — at least two teams other than your own. For P6, ideally spanning at least two client accounts.</li>
<li><strong>Organization</strong> — LFT Engineering as a whole.</li>
<li><strong>Cycle</strong> — one performance review period, as set by People Ops.</li>
<li><strong>Core and supporting</strong> — at P3–P5, 15–17 core competencies are the main focus when discussing readiness for the next level. AI-Assisted Engineering is core at P3–P5; AI Engineering and AI Security Engineering are supporting. Supporting competencies guide development and can show where someone Exceeds.</li>
</ul></div>

<div class="gsec"><h3>Evidence principles</h3>
<ul>
<li>Evidence lists are <strong>illustrative, not a checklist</strong>. One or two strong examples per competency are enough.</li>
<li>Prefer <strong>outcomes</strong> (fewer escaped defects, faster ramp-up, a decision that held) over artifacts (a document exists, a session was held).</li>
<li>Do not create documents only to evidence a rubric line. If a manager cannot verify an item, rate on observed behaviour and peer input.</li>
<li>Use the <strong>Compare next ↔</strong> view in 1:1s to show what changes at the next level.</li>
</ul></div>

<div class="gsec"><h3>Scope by level</h3>
<ul>
<li><strong>P2 core set</strong> (rated): Writing Code, Testing, Debugging, Understanding Code, Software Architecture, Security, AI-Assisted Engineering, AI Security Engineering, Work Breakdown, Prioritisation & Dependencies, Reliability & Delivery Accountability, Seeking & Receiving Feedback, Effective Communication, Knowledge Sharing, Teamwork, Relationship Building, Handling Disagreement, Mentoring, Product Thinking. Other P2 cells are development guidance only.</li>
<li><strong>Where applicable</strong>: AI Judgment &amp; Delivery and AI Security Engineering depend on project assignment — rate N/A when there was no opportunity.</li>
<li><strong>P7 teaching</strong> is consolidated into one annual leadership curriculum, planned with the VP of Engineering, instead of separate sessions for each competency.</li>
</ul></div>

<div class="gsec"><h3>Growth tasks</h3>
<p>Every competency has three small tasks at each level that build toward the next level:</p>
<ul>
<li><strong>Quick win</strong> (1–2 days): builds confidence and gives a first piece of evidence.</li>
<li><strong>Stretch</strong> (1–2 weeks): practises the current level's rubric on real work.</li>
<li><strong>Next-level preview</strong> (2–4 weeks): a small, safe taste of the next level's scope.</li>
</ul>
<p style="margin-top:8px">Each task explains <strong>why it matters</strong> in plain language and gives a <strong>question to ask in 1:1</strong>, so managers who are not close to the code can still coach it. Labels show:</p>
<ul>
<li><strong>Fits in normal work</strong> or <strong>Needs time set aside</strong>. Agree time for the second kind with the project lead before assigning it.</li>
<li><strong>Works without a project</strong>: suitable for engineers on the bench, using an internal tool, practice repo or open-source project.</li>
<li><strong>Coach</strong>: who is best placed to check the “done when”. People manager, tech lead (P2–P4), or principal or architect (P5–P7).</li>
<li><strong>On the bench</strong>: a fourth task at P4–P6 for engineers between projects, using internal tools, practice projects or pre-sales work.</li>
<li><strong>Client-facing</strong>: confirm with the account lead before assigning.</li>
</ul>
<p style="margin-top:8px"><strong>Find tasks</strong> suggests tasks for an engineer's level and their one to three weakest competencies. Copy the list into your own 1:1 notes. The framework does not store plans. A completed task counts as evidence for the rubric; it is not a checklist on its own.</p></div>
</div>`;

let S={section:'ic',emlv:'m1',di:0,si:0,lv:'p4',mode:'competency',view:'matrix',compare:false,use:'promotion',flv:'p3',fsubs:[],ff:[],hlv:'p4',plv:'p3'};

function renderTopNav(){}

function renderSidebar(){

  $('sub-list').innerHTML=DOMAINS.map((d,di)=>{

function resolveCell(sub,lvId){
  const c=sub.levels[lvId];
  if(c===NA||!c||c.na)return{na:true};
  if(c===SEE_P4)return Object.assign({seeP4:true},sub.levels.p4);
  return c;
}

function renderContent(){

  if(S.view==='guide'){el.innerHTML=GUIDE_HTML;el.scrollTop=0;return;}
  if(S.view==='release'){el.innerHTML=RELEASE_HTML;el.scrollTop=0;return;}

  if(isSupporting(sub.id,S.lv)&&!cell.na)notes.push(`<b>Supporting at ${lv.code}.</b> Not a main focus at this level. Rate it when there is clear evidence, and use it for development.`);
  if(WHERE_APPLICABLE[sub.id]&&!cell.na)notes.push(`<b>Where applicable.</b> ${esc(WHERE_APPLICABLE[sub.id])}`);
  if(isPilot(sub.id)&&!cell.na)
    h+=`<div class="ai-note"><div class="ai-note-head"><span class="ai-badge">✦ AI fluency · ${AI_THEME[sub.id]}</span><span class="ai-kw">${esc(AI_KEYWORD[sub.id][S.lv])}</span></div><p>A priority area for LFT. Judge the overall pattern, not each bullet, and accept evidence from internal work, a sandbox exercise or a previous engagement.</p></div>`;

  if(S.compare){
    const i=LEVELS.findIndex(l=>l.id===S.lv);
    const nx=LEVELS[i+1];
    if(!nx){

    }else{
      const col=(l,c,cls)=>`<div class="cmp-col ${cls}"><div class="cmp-head"><span class="lcode">${l.code}</span><span class="lt">${esc(l.title)} · ${esc(l.scope)}</span></div>`+
        (c.na?`<p class="cmp-exp">Not assessed at this level.</p>`:
        `${c.seeP4?'<p class="lt" style="margin:0">Holds the P4 bar</p>':''}<p class="cmp-exp">${esc(c.expectation)}</p><ul>${c.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`)+`</div>`;
      if(S.lv==='p6')h+=`<div class="info-note">P7 (Solution Architect) is not reached through promotion. It is shown here for reference.</div>`;
      h+=`<div class="compare-grid">${col(lv,cell,'')}${col(nx,resolveCell(sub,nx.id),'next')}</div>`;
    }
    h+=`</div>`;el.innerHTML=h;return;
  }

  if(cell.na){
    h+=`<div class="na-card">Not assessed at this level.${S.use!=='hiring'?' The growth tasks below prepare an engineer for when it is assessed.':''}</div>`;
    if(S.use!=='hiring')h+=`<div class="sections-grid">${growthSection(sub,S.lv)}</div>`;

  if(notes.length)h+=`<div class="ctx-notes">${notes.map(n=>`<p>${n}</p>`).join('')}</div>`;

function growthSection(sub,lvId){
  const tasks=(GROWTH[sub.id]||{})[lvId];if(!tasks)return '';
  const nx=nextCode(lvId);
  return `<details class="section full growth" open><summary class="growth-head"><span class="sh">Growth tasks <span class="sh-hint">${tasks.length} small wins toward ${growthGoal(lvId)} · keep 1–3 active</span></span><button class="link-btn" data-act="find-from" data-sub="${esc(sub.id)}">Find tasks across competencies →</button></summary><div class="gt-grid">${tasks.map((t,i)=>taskCard(t,i,lvId)).join('')}</div></details>`;
}

function finderResults(){
  const subs=S.fsubs.length?S.fsubs:DOMAINS.flatMap(d=>d.subs.map(s=>s.id));
  const out=[];
  DOMAINS.forEach(d=>d.subs.forEach(s=>{
    if(!subs.includes(s.id))return;
    const tasks=GROWTH[s.id][S.flv].map((t,i)=>({t,i})).filter(o=>passes(o.t));
    if(tasks.length)out.push({d,s,tasks});
  }));
  return out;
}

function finderText(res){
  const lv=LEVELS.find(l=>l.id===S.flv);
  const lines=[`Growth tasks: ${lv.code} → ${growthGoal(S.flv)}`];
  if(S.ff.length)lines.push('Filters: '+S.ff.map(f=>FILTERS.find(x=>x.id===f).label).join(', '));
  lines.push('');
  res.forEach(r=>{
    lines.push(`${r.s.label} (${r.d.label})`);
    r.tasks.forEach(({t,i})=>{
      lines.push(`- [${GKIND[i].label}, ${GKIND[i].time}] ${t[0]}`);
      lines.push(`  Why: ${t[3]}`);lines.push(`  Task: ${t[1]}`);lines.push(`  Done when: ${t[2]}`);lines.push(`  Ask in 1:1: ${t[4]}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

function copyText(txt,msg){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg);}catch(_){toast('Copy failed');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast(msg),fallback);else fallback();
}
function findSub(id){for(const d of DOMAINS)for(const s of d.subs)if(s.id===id)return{d,s};return null}
const DOMKEY={technical:'technical',delivery:'delivery',fcc:'fcc',leadership:'leadership',strategic:'strategic'};

function renderHiring(){

  h+=`<div class="chips">${LEVELS.map(l=>`<button class="chip" data-hlv="${l.id}" aria-pressed="${l.id===S.hlv}">${l.code} · ${esc(l.title)}</button>`).join('')}</div>`;

  h+=`<div class="gsec"><h3>Interview loop</h3><div class="tbl-wrap"><table><thead><tr><th>Round</th><th>Minutes</th><th>Interviewers</th><th>Competencies</th><th>Focus</th></tr></thead><tbody>${H.loop.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${esc(r[2])}</td><td>${r[3].split(',').map(id=>esc(findSub(id).s.label)).join(', ')}</td><td>${esc(r[4])}</td></tr>`).join('')}</tbody></table></div></div>`;
  const X=H.exercise;
  h+=`<div class="gsec"><h3>Exercise: ${esc(X.title)} (${X.mins} min)</h3><p>${esc(X.brief)}</p><p><b>Look for:</b></p><ul>${X.lookFor.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h+=`<div class="gsec"><h3>Scoring guide</h3><p>Score each competency Strong, Acceptable or Weak. <b>Guideline:</b> a strong candidate usually has no Weak and is Strong on about half of the competencies assessed. This is a guide for the panel, not a fixed bar; the hiring decision rests with the panel and hiring manager. Use the questions as written; ask for a comparable past project when a question assumes LFT context.</p>`;

      <div class="anchor-grid"><div class="anchor a-strong"><b>Strong</b>${esc(a[0])}</div><div class="anchor a-ok"><b>Acceptable</b>${esc(a[1])}</div><div class="anchor a-weak"><b>Weak</b>${esc(a[2])}</div></div></div>`;

  h+=`<div class="gsec"><h3>Level placement</h3><div class="pair"><div class="anchor a-weak"><b>Signals of the level below</b>${esc(H.below)}</div><div class="anchor a-strong"><b>Signals of the level above</b>${esc(H.above)}</div></div><p>When signals are mixed, place the candidate at the lower level and note what would justify a promotion review within a year.</p></div>`;

function hiringText(){
  const lv=LEVELS.find(l=>l.id===S.hlv);const H=HIRING[S.hlv];const L=[`Interview pack: ${lv.code} ${lv.title}`,'','Loop:'];
  H.loop.forEach(r=>L.push(`- ${r[0]} (${r[1]} min, ${r[2]}): ${r[3].split(',').map(id=>findSub(id).s.label).join(', ')}. ${r[4]}`));
  L.push('',`Exercise: ${H.exercise.title} (${H.exercise.mins} min)`,H.exercise.brief,'Look for:');H.exercise.lookFor.forEach(x=>L.push('- '+x));
  L.push('','Scoring (Strong / Acceptable / Weak). Guideline (not a fixed bar): usually no Weak; Strong on about half.');
  Object.keys(H.anchors).forEach(id=>{const f=findSub(id);const a=H.anchors[id];const c=f.s.levels[S.hlv];L.push('',f.s.label);
    if(c&&c.questions)c.questions.forEach(q=>L.push('  Q: '+q));
