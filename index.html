      ["Publish a team AI security standard covering injection prevention, credential hygiene, context boundaries, and agent permission scoping — reviewed in the last quarter.","Produce a threat model for every team AI feature that takes untrusted input or has tool access, covering direct injection, indirect injection, exfiltration via tool calls, excessive permissions, and unsafe autonomy.","In a sample of 10 AI PRs, all show the standard applied without your intervention.","Reject any PR with broad tool permissions or ungated agent config without a written reason."],
      ["Walk me through the team AI security standard you wrote. What does each section cover?","Describe a threat model you ran for a team AI feature. What risks did you find?","How do you enforce the standard without reviewing every AI PR yourself?"],
      ["Team AI security standard — reviewed in the last quarter.","Threat models produced for team AI features — all five risk areas covered.","AI PR sample showing standard applied without your intervention."]),
    p6:L("Understands the AI security approach of several teams. Works with those teams to close recurring security gaps and uses evidence to track improvement. Reconciles differing lead interpretations to one reading. Works with the security team to integrate AI-specific risks into org security review. Influences org-wide AI security strategy.",
      ["Drive a structural fix for one AI security gap recurring across at least two teams — named contacts and before-and-after recurrence numbers required.","Reconcile differing team lead interpretations of the AI security standard into one written reading.","Add AI-specific risks to the org security review — at minimum as a backlog item with a named owner.","Train at least two team leads to apply the standard without your involvement."],
      ["Describe a recurring AI security gap you fixed across teams. What was the structural change and what were the before-and-after numbers?","How do you reconcile two team leads who interpret the AI security standard differently?","How did you get AI-specific risks included in the org security review process?"],
      ["Structural AI security fix with named contacts and before-and-after recurrence data.","Written reconciled interpretation of the AI security standard.","AI-specific risks in org security review — backlog item or checklist entry with named owner."]),
    p7:L("Understands the organisation's AI security posture. Uses enforcement data to identify gaps. Works with all teams to apply and enforce the policy. Drives org-wide AI security strategy. Aligns the standard with client contractual requirements and applicable regulatory obligations.",
      ["Publish a versioned org AI security standard covering prompt injection, context boundaries, model API governance, and agent autonomy.","Enforce the standard with traceability: exceptions go through a named decision owner and are logged.","Map the standard to client contract clauses and regulatory obligations for each client.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["Walk me through the org AI security standard you would set. What does each section cover?","How do you enforce the standard with traceability? What happens when a team needs an exception?","How do you map the AI security standard to each client's contract clauses and regulatory obligations?"],
      ["Published versioned org AI security standard.","Exception log with named decision owners and outcomes.","Standard mapped to client contract clauses — per client record."]),
  }},
]},
{id:'delivery',label:'Delivery',subs:[
  {id:'work-breakdown',label:'Work Breakdown',levels:{
    p2:L("Understands value of rightsizing tasks to enable continuous integration and incremental delivery.",
      ["Explain why a task is too large before agreeing to work on it.","Flag tasks that will take more than one day without a clear checkpoint.","Ask for help breaking down any task with unclear scope before starting.","Follow the team's definition of 'ready' before pulling a task into a sprint."],
      ["Why does task size matter for continuous integration? Walk me through the reasoning.","How do you recognise a task that is too large to pull into a sprint?","What do you do if you are given a task whose scope is unclear?"],
      ["Task size concerns raised before sprint start — not mid-sprint.","No tasks pulled in without a clear acceptance criterion.","Ability to explain the CI/CD value of small, incremental tasks."]),
    p3:L("Before beginning work, ensures that tasks are appropriately sized for continuous integration and incremental delivery with help from teammates and manager.",
      ["Resize tasks with a teammate or manager before starting work — not after you hit a blocker.","Note every dependency when accepting a task.","Confirm each task has a written acceptance criterion before starting.","Verify task size fits within a single deploy cycle with guidance."],
      ["Describe a task you resized before starting. What was too large about the original task?","How do you identify a dependency on another task or team?","What do you do when a task has no acceptance criterion?"],
      ["Sprint history shows tasks consistently at or below the team's agreed size limit.","Dependencies noted in tickets before work starts.","Acceptance criteria present on all assigned tasks before sprint start."]),
    p4:L("Reviews tasks critically and ensures they're appropriately sized for continuous integration and incremental delivery.",
      ["Resize any task exceeding the team's agreed size limit before it enters the sprint — not after.","Identify and document every dependency before a task starts.","Reject tasks with unclear acceptance criteria until criteria are written.","Size each task to enable at least one deploy per day of work."],
      ["Show me a task you resized. How did you identify it was too large and how did you split it?","How do you handle a task with unclear acceptance criteria pulled into your sprint?","Describe catching a dependency that others missed before the sprint started."],
      ["Sprint history shows resized tasks with before/after size notes.","Dependency documents present in ticket descriptions before sprint start.","No tasks pulled in without written acceptance criteria — verified in sprint review records."]),
    p5:L("Reviews epics and projects critically and ensures they're appropriately broken down, prioritised, and well understood by the team.",
      ["Break epics into tasks the whole team can work on in parallel without blocking each other.","Facilitate a team session to validate epic breakdown before work starts.","Verify every engineer can state the epic's goal without notes before the sprint begins.","Escalate epics that cannot be broken down without additional information."],
      ["Describe an epic breakdown you led. How did you verify the team understood it?","How do you handle an epic that cannot be broken down because requirements are too vague?","How do you know when an epic is broken down well enough to start?"],
      ["Epic breakdown documents with tasks mapped to team members — produced before sprint start.","Pre-sprint alignment sessions with attendance records.","Team members state epic goals without notes at sprint start — verified."]),
    p6:L("Reviews cross-team work critically and ensures it's appropriately broken down and prioritised, and well understood by all involved teams.",
      ["Review cross-team work and identify tasks that must be split across team boundaries before work starts.","Document cross-team dependencies before any team starts work.","Confirm all teams agree on the breakdown and priority before work starts.","Track cross-team work in a shared format accessible to all teams."],
      ["Describe reviewing cross-team work for breakdown and priority. How did you get all teams to agree?","What is the most common breakdown mistake you see at the cross-team level?","How do you track cross-team work so all teams stay aligned?"],
      ["Cross-team work breakdown documents with team assignments — produced before work starts.","Dependency records signed off by all involved teams.","Cross-team alignment sessions with all teams present — with attendance records."]),
    p7:L("Reviews organization-wide work critically and ensures it's appropriately broken down and prioritised across the organization.",
      ["Review org-wide roadmap items and validate breakdown to team-level tasks before any team starts.","Identify org-wide sequencing dependencies before any team begins work.","Install a process that prevents unbroken-down work from entering team sprints.","Measure the impact of breakdown quality on delivery pace at the org level."],
      ["How do you review an org-wide roadmap for breakdown quality?","What process would you install to prevent poorly broken-down work from reaching teams?","How do you measure the impact of good task breakdown on org delivery pace?"],
      ["Org-wide breakdown review process — documented and in active use.","Roadmap items with breakdown validation records before team sprint start.","Delivery pace metric before and after breakdown process improvement."]),
  }},
  {id:'prioritisation',label:'Prioritisation & Dependencies',levels:{
    p2:L("Acts according to task prioritisation.",
      ["Pull tasks in priority order — do not skip ahead without asking the team lead.","Confirm priority order with the team lead before starting a new task.","Flag when a blocker prevents you from working the next priority task.","Complete one task before starting the next unless instructed otherwise."],
      ["How do you decide which task to pick up next?","What do you do if the priority order seems wrong to you?","What do you do if your current task is blocked and you cannot move the next priority task forward?"],
      ["Sprint history shows tasks pulled in priority order.","Blockers escalated same day — standup or async record.","No parallel task-hopping visible in sprint board."]),
    p3:L("Understands and acts according to task prioritisation. Notes dependencies.",
      ["Record every dependency in the ticket before starting work on that task.","Confirm priority with the team lead when the order is unclear.","Flag a change in priority to the team lead within one day of observing it.","Communicate a dependency-caused delay on the day you identify it — not after missing a date."],
      ["How do you record a dependency when you find one?","What do you do if a noted dependency becomes a blocker?","How do you decide whether a priority concern is urgent enough to raise with the team lead now?"],
      ["Tickets show dependencies noted before work starts.","Dependency blockers escalated within one day of identification — verified in standup records.","Priority concerns communicated before missing a deadline — not after."]),
    p4:L("Ensures tasks are prioritised correctly, and that dependencies are noted.",
      ["Review the sprint backlog and correct any mis-prioritised tasks before the sprint starts.","Identify every dependency for each task entering the sprint.","Raise a dependency risk to the team lead when it could delay the sprint — before it delays it.","Document priority corrections with the reasoning in the ticket or sprint notes."],
      ["Describe a time you corrected a mis-prioritised task. How did you identify it?","How do you ensure all dependencies are captured before a sprint starts?","What is your process when you find a dependency that could delay the sprint?"],
      ["Sprint retro notes show priority corrections made before sprint start — not mid-sprint.","Dependency documents present in all sprint tickets.","Dependency risks raised to team lead before they delayed the sprint — with dates."]),
    p5:L("Ensures dependencies are noted and well understood by the team, at both the task and epic level. Fosters a culture of priority setting and urgency in alignment with organizational strategy.",
      ["Run a dependency review at the epic level before work starts — not just at the task level.","Confirm every team member can describe the epic's dependencies without notes.","Connect team priorities to org strategy in sprint planning — make the link explicit.","Catch dependency risks at the epic level before they propagate to the task level."],
      ["How do you run an epic-level dependency review?","How do you ensure the team understands dependencies — not just that they are noted in tickets?","How do you connect sprint priorities to org strategy in a way the team finds useful?"],
      ["Epic-level dependency maps produced before work starts.","Sprint planning notes show explicit org strategy connection.","Team members state epic dependencies without notes at sprint start — verified."]),
    p6:L("Ensures cross-team dependencies are noted and well understood by all teams involved. Works across teams to foster a culture of priority setting and urgency.",
      ["Identify cross-team dependencies before any team starts work on the related epic.","Produce a shared dependency document accessible to all involved teams.","Facilitate a cross-team session to confirm all teams understand the dependencies.","Escalate priority conflicts across teams before they delay delivery."],
      ["How do you identify cross-team dependencies before they become blockers?","Describe a cross-team dependency you resolved before it delayed delivery.","How do you escalate a priority conflict between two teams?"],
      ["Cross-team dependency documents produced before epics start — accessible to all teams.","Cross-team dependency review sessions — with attendance records.","Priority conflicts escalated and resolved before delivery delays — with dates."]),
    p7:L("Identifies dependencies across the organization and works with individual teams to resolve them before they become an issue. Installs preventative measures to mitigate repeat occurrences.",
      ["Map org-wide dependencies for each major initiative before work starts.","Identify recurring dependency patterns and install a process to prevent repeat blockers.","Measure the reduction in dependency-caused delays after each preventive process is installed.","Report org-wide dependency status to stakeholders on a defined cadence."],
      ["How do you map org-wide dependencies for a major initiative?","Describe a recurring dependency problem you solved at the org level. What was the structural fix?","How do you prevent the same dependency issue from recurring across different teams?"],
      ["Org-wide dependency maps produced per initiative — before work starts.","Preventive process installed with before-and-after blocker data.","Recurring dependency patterns eliminated — verified across at least two consecutive cycles."]),
  }},
  {id:'ambiguity',label:'Dealing with Ambiguity',levels:{
    p2:NA,
    p3:L("Usually handles risk, change, and uncertainty within their personal scope of work effectively. Usually decides and acts responsibly without having the total picture.",
      ["Make a decision within your task scope when you have enough information to act — do not wait for certainty.","Record the assumption you acted on and the decision you made.","Escalate only when a decision requires authority or information you cannot obtain yourself.","Distinguish between 'I need more information' and 'I am waiting to be told what to do'."],
      ["Describe a decision you made without having the full picture. What did you know, what did you assume, and what did you do?","How do you decide when you have enough information to act?","Describe a time you escalated because you genuinely needed authority or information you could not get yourself."],
      ["Decisions made within task scope without waiting for full picture — PR notes or decision records.","Assumptions recorded alongside decisions — not reconstructed after the fact.","Escalations used for genuine authority gaps — not as a substitute for deciding."]),
    p4:L("Handles risk, change, and uncertainty within their personal scope of work effectively. Decides and acts responsibly without having the total picture in routine and high-pressure situations.",
      ["Make a sound decision within your scope under pressure — do not defer under urgency.","Write the decision, the key assumptions, and the rationale before acting.","Revisit a decision when new information invalidates an assumption — update the record.","Distinguish which risks are in your scope to decide and which require escalation."],
      ["Describe a high-pressure situation where you had to decide without the full picture. What risk did you accept and why?","How do you revisit a decision when new information arrives mid-implementation?","How do you know when a risk is yours to decide versus when to escalate?"],
      ["Decision records produced under high-pressure situations — with assumptions and rationale noted.","Decisions revised when assumptions failed — revision notes on file.","Escalation decisions documented with clear scope reasoning."]),
    p5:L("Effectively handles risk, change, and uncertainty within their team. Decides and acts responsibly without having the total picture.",
      ["Guide the team to a decision when requirements are incomplete — do not let ambiguity stall delivery.","Separate what the team must know now from what it can learn after starting.","Document the team's decision and the conditions that would trigger a revisit.","Model responsible decision-making so teammates replicate it independently."],
      ["Describe guiding your team to a decision despite incomplete requirements. How did you decide what you needed to know before acting?","How do you teach the team to decide responsibly under ambiguity?","How do you document a team decision so it is revisited when the right conditions arise?"],
      ["Team decision records produced under ambiguity — with conditions for revisit noted.","Delivery not stalled by ambiguity — sprint retro records confirm.","Teammates making independent decisions under ambiguity without waiting for you."]),
    p6:L("Effectively handles risk, change, and uncertainty across several teams.",
      ["Resolve uncertainty that blocks multiple teams — prevent each team from solving the same ambiguity differently.","Produce a shared decision record accessible to all affected teams.","Identify when ambiguity is a governance gap versus a knowledge gap and address each differently.","Follow up to verify all teams adopted the shared decision — not just received it."],
      ["Describe resolving uncertainty that was blocking multiple teams. How did you prevent conflicting decisions?","How do you distinguish a governance gap from a knowledge gap?","How do you verify that all teams adopted a shared decision rather than going their own way?"],
      ["Cross-team decision records resolving shared ambiguity — adopted by all affected teams.","Teams not solving the same ambiguity independently — verified in retros across teams.","Governance gaps addressed structurally — not as repeated one-off decisions."]),
    p7:L("Effectively handles risk, change, and uncertainty across the organization.",
      ["Identify org-wide uncertainty before it fragments into conflicting team-level decisions.","Produce an org-level decision with enough specificity that teams do not need to re-decide at their level.","Establish a process for handling recurring org-level uncertainty — not just one-off decisions.","Communicate the org-level decision and its rationale to all teams before they start work."],
      ["Describe an org-wide uncertainty you resolved. How did you prevent teams from making conflicting decisions while it was open?","What process would you install to handle recurring org-level ambiguity?","How do you write an org-level decision so teams do not need to interpret it differently?"],
      ["Org-level decision records that resolved uncertainty without requiring re-decision at team level.","Recurring ambiguity handled by a documented process — not repeated ad hoc decisions.","Org-level decisions communicated to all teams before work starts — with confirmation records."]),
  }},
  {id:'reliability',label:'Reliability & Delivery Accountability',levels:{
    p2:L("Has daily conversation with the team about the progress of their work. Delivers on commitments with a sense of urgency.",
      ["Give a specific progress update in the team's daily standup: task, current state, and next action.","Raise a blocker to the team lead on the same day you identify it.","Treat every sprint commitment as a promise — communicate the risk before missing the deadline.","Deliver on every committed task in the sprint or flag a risk before the sprint ends."],
      ["How do you give a progress update in standup? Walk me through what you say.","What do you do when a committed task is taking longer than expected?","How quickly do you escalate a blocker and what do you include when you do?"],
      ["Daily standup updates are specific — task, state, and next action — not 'working on it'.","Blockers escalated same day — standup or Slack record.","No sprint commitments missed without prior warning to the team lead."]),
    p3:L("Commits to a realistic amount of work, and works with teammates to ensure they understand priority and urgency. Escalates blockers, delays, and cost ballooning to their team daily.",
      ["Commit only to tasks you can complete in the sprint — not everything that looks interesting.","Escalate a blocker, delay, or cost overrun to the team lead on the day you identify it.","Confirm that teammates understand what is urgent before handing off a shared task.","Communicate a revised estimate before the original deadline — not after missing it."],
      ["How do you decide how much work to commit to in a sprint?","Describe the last time you escalated a blocker. How early did you raise it?","How do you communicate a revised estimate to your team lead?"],
      ["Sprint commitment vs. delivery ratio — consistently realistic across cycles.","Blocker escalations made on day of identification — standup or Slack records.","Revised estimates communicated before the original deadline — on file."]),
    p4:L("Ensures their commitments are realistic, understands their priority and urgency, and delivers accordingly. Anticipates and communicates blockers, delays, and cost ballooning before they require escalation.",
      ["Identify a risk to a commitment before it becomes a blocker and communicate it to the team lead.","Estimate effort before committing — do not accept ambiguous scope without clarifying it first.","Track your own delivery against sprint commitments and self-correct before the sprint ends.","Communicate cost ballooning to the team lead as soon as you detect it — not at sprint review."],
      ["Describe anticipating a delivery risk before it became a blocker. How early did you catch it and what did you say?","How do you estimate effort before committing to a task?","How do you self-correct when you are behind mid-sprint?"],
      ["Delivery risks communicated before they required escalation — standup or async record.","Self-corrections to sprint scope made before sprint end — not surfaced at review.","Cost ballooning raised to team lead before the overrun was locked in — with dates."]),
    p5:L("Anticipates and communicates blockers, delays, and cost ballooning within their team's projects before they require escalation. Ensures expectations with their team and external stakeholders are clarified.",
      ["Review delivery risks in sprint planning — a few minutes is enough — so blockers surface before they hit.","Agree technical scope and trade-offs with client stakeholders before work starts; the EM owns commitments and contract terms.","Escalate a project-level risk to your manager before the project timeline is at risk.","Track team delivery against plan and flag deviations early; share effort trends with the EM, who owns cost and commercial risk."],
      ["Describe anticipating a team-level delivery risk before it required escalation. How did you surface it?","How do you clarify expectations with an external stakeholder before work starts?","How do you track team-level cost and delivery against plan?"],
      ["Risks raised in planning before they hit — examples from the review period.","Stakeholder expectation documents produced before work starts.","Project-level risks escalated before timeline impact — with dates."]),
    p6:L("Successfully manages cross-team commitments, their progress, and roadmap to delivery. Anticipates and communicates blockers and delays across teams.",
      ["Track cross-team commitments on a shared roadmap updated at least weekly.","Identify a cross-team delivery risk before it delays any team's sprint.","Communicate a cross-team delay to all affected leads on the day you identify it.","Hold each team accountable to its roadmap commitment without micromanaging how it delivers."],
      ["How do you track cross-team commitments on a shared roadmap?","Describe anticipating a cross-team delivery risk. How early did you catch it and what did you communicate?","How do you hold teams accountable without micromanaging their delivery approach?"],
      ["Shared cross-team roadmap — updated weekly, accessible to all teams.","Cross-team delivery risks communicated before sprint impact — with dates.","Accountability conversations with team leads — documented outcomes."]),
    p7:L("Successfully manages organization-wide commitments, their progress, and roadmap to delivery. Ensures expectations across the organization and external stakeholders are clarified.",
      ["Maintain an org-wide delivery roadmap at major milestone level — not individual tasks.","Clarify expectations with executive and external stakeholders before major commitments are made.","Identify an org-wide delivery risk at least one quarter before it affects external commitments.","Report org-wide delivery status to stakeholders on a defined cadence."],
      ["How do you maintain an org-wide delivery roadmap?","How do you clarify expectations with external stakeholders before a major commitment?","How far in advance can you identify an org-wide delivery risk and what signals do you use?"],
      ["Org-wide delivery roadmap maintained and reported to stakeholders on a defined cadence.","Expectation documents produced with external stakeholders before major commitments.","Delivery risks identified at least one quarter before external impact — with evidence."]),
  }},
  {id:'economic-thinking',label:'Economic Thinking',levels:{
    p2:L("Understands the importance of weighing cost and value in decision making. Asks more senior engineers for help applying this type of thinking.",
      ["Describe the cost and value tradeoff in a technical decision before asking a senior engineer for guidance.","Ask the senior engineer to help with a specific decision — not to explain economic thinking in general.","Accept the most economic path when a senior engineer recommends it.","Name one cost (time, complexity, or risk) for every technical option you present."],
      ["Describe a decision where cost and value were both relevant. How did you frame it?","When would you ask a senior engineer to help you make a cost-value tradeoff?","How do you identify the cost of a technical option?"],
      ["Questions to senior engineers are specific to a cost-value decision — not open-ended requests for advice.","PR descriptions show awareness of cost in technical decisions.","Accepted the economic path when recommended — no sunk-cost resistance visible."]),
    p3:L("Weighs cost and value to take the most economic action with help from more senior engineers. Sometimes uses this thinking to make suggestions to teammates.",
      ["Name the cost and the value of each option before choosing between two technical approaches, with guidance.","Propose the more economic option to a teammate when you see one.","Document the economic rationale for a technical decision in the PR description.","Name cost and value explicitly when you comment on a peer's suggestion."],
      ["Describe a decision where you weighed two options and chose the more economic one. How did you calculate cost and value?","Describe suggesting a more economic approach to a teammate. What was their response?","How do you document economic reasoning in a PR so a reviewer can follow it?"],
      ["PR descriptions include cost-value rationale for technical decisions.","Suggestions to teammates with economic reasoning — examples from the review period.","Cost-value options documented before choosing — not after the decision is made."]),
    p4:L("Weighs cost and value in order to take the most economic action. Uses this thinking in their own work and to make suggestions to teammates.",
      ["Name the cost and value of each option for every significant technical decision — not just the chosen one.","Propose a more economic approach to a teammate before they commit to a less economic one.","Reject solutions that optimise for short-term convenience at high long-term cost — name the cost explicitly.","Apply economic thinking consistently — not only when options are obviously different in cost."],
      ["Walk me through a decision where economic thinking changed which option you chose.","Describe proposing a more economic approach to a teammate. How did you frame it without dismissing their idea?","How do you evaluate short-term convenience against long-term cost in a technical decision?"],
      ["Technical decisions in PRs include cost-value comparison — not just the chosen path.","Economic suggestions made to teammates with outcomes documented.","High long-term cost solutions rejected or escalated — with economic rationale on file."]),
    p5:L("Uses economic thinking in their own work and fosters a culture within their team where people apply economic thinking to make timely decisions.",
      ["Facilitate team design decisions using cost-value reasoning — not by vote or deference to seniority.","Make the cost-value step visible in team design decisions — ask for it until the team does it unprompted.","Ask for the cost-value step whenever a design decision skips it.","Make the team's economic reasoning visible — document it in design docs and decision records."],
      ["How do you facilitate a team decision using economic thinking?","What does it look like when the team applies economic thinking well?","How do you build this habit when a team is not used to thinking in cost and value terms?"],
      ["Team decisions documented with cost-value reasoning — not just outcome.","Cost-value step present in team design decisions without your prompting.","Teammates independently applying economic reasoning in design decisions — visible in PR descriptions."]),
    p6:L("Uses economic thinking in their own work and fosters a culture across several teams.",
      ["Apply economic thinking to cross-team decisions — name the cost and value impact on each team separately.","Guide team leads to apply economic reasoning in their team's decisions without your involvement.","Identify where cost-value reasoning is absent across teams and intervene with a structural fix.","Track economic reasoning quality in cross-team decision records at least quarterly."],
      ["Describe applying economic thinking to a cross-team decision. How did you account for cost and value impact on multiple teams?","How do you build an economic thinking habit across teams you do not directly lead?","What structural fix would you apply when a team consistently skips cost-value reasoning?"],
      ["Cross-team decision records include cost-value reasoning per team.","Team leads applying economic reasoning independently — with evidence across at least two teams.","Structural interventions where economic reasoning was absent — documented outcomes."]),
    p7:L("Uses economic thinking in their own work and fosters a culture within the organization.",
      ["Apply economic thinking to org-wide decisions — name cost and value impact at the org level.","Set an expectation that all major engineering decisions include a cost-value analysis.","Make it stick without you: leads can explain the standard and apply it to their own teams.","Measure adoption by tracking cost-value reasoning in major decision records org-wide."],
      ["How do you apply economic thinking to an org-wide decision?","What does a cost-value culture look like at the org level — what behaviours are visible?","How do you teach economic thinking to engineering leads who are not naturally analytical?"],
      ["Org-wide decision records include cost-value reasoning — tracked and reported.","Leads apply it independently — visible in their own teams' decisions and reviews.","Adoption measured in major decision records — before and after teaching sessions."]),
  }},
]},
{id:'fcc',label:'Feedback & Collaboration',subs:[
  {id:'delivering-feedback',label:'Delivering Feedback',levels:{
    p2:L("Understands how to deliver praise and constructive feedback in a useful manner.",
      ["Name two qualities that make feedback useful before delivering it.","Separate praise from critique — deliver each clearly.","Address the specific behaviour, not the person, when giving constructive feedback.","Ask before delivering unsolicited feedback to a teammate."],
      ["What makes feedback useful versus not useful? Give me a concrete example of each.","Describe a time you gave a teammate positive feedback. What did you say and why?","How do you decide when to give constructive feedback to a teammate?"],
      ["Can name specific qualities of useful feedback — not just 'be kind'.","Gives praise with a specific behaviour named — not just 'good job'.","No unsolicited feedback given without first checking the receiver is open to it."]),
    p3:L("Delivers praise and constructive feedback to their team, teammates, and manager in a useful manner.",
      ["Give teammates specific, behavioural praise as a regular habit — not only at review time.","Deliver constructive feedback to a teammate or manager with a specific example — not a general impression.","Choose the right moment and setting for feedback — not in a public forum for criticism.","Check that the feedback landed as intended — ask the receiver what they heard."],
      ["Describe a specific piece of constructive feedback you gave a teammate or manager. What did you say?","How do you choose the right moment to give feedback?","How do you check that feedback landed as you intended?"],
      ["Peers and manager confirm they receive specific, useful feedback from you.","Feedback references a specific behaviour and a specific example — not a general trait.","Setting chosen appropriately — constructive feedback given in private."]),
    p4:L("Delivers praise and constructive feedback to their team, teammates, manager, and team's business stakeholders when opportunities arise.",
      ["Deliver feedback to business stakeholders in their language — not engineering jargon.","Adapt tone and framing of feedback to the stakeholder's context and relationship.","Capture and route client-given feedback about an LFT engineer to that engineer's LFT manager — do not let it stay informal.","Deliver feedback to a stakeholder even when it is uncomfortable — do not wait for a perfect moment."],
      ["Describe feedback you gave to a business stakeholder. How did you adapt your language and framing?","How do you handle feedback a client gives you about a teammate? What do you do with it?","Describe delivering difficult feedback to someone with more authority than you. How did you approach it?"],
      ["Feedback delivered to business stakeholders — at least one instance per engagement.","Client-given feedback about LFT engineers routed to the engineer's manager — written record.","Difficult feedback delivered — not withheld until a review cycle."]),
    p5:L("Fosters a culture of delivering praise and constructive feedback within their team and team's respective business stakeholders. Actively demonstrates these behaviours.",
      ["Run a team ritual that creates a regular feedback moment — retro, shoutout, or peer review.","Name one specific person who now gives feedback more regularly because of your influence.","Model feedback-giving in team settings so others see the standard.","Coach a teammate on how to deliver feedback more effectively when you observe a missed opportunity."],
      ["Describe a ritual or norm you introduced to make feedback regular on your team.","Name a teammate who gives feedback more often now. What did you do that influenced them?","How do you model feedback-giving so the team picks it up without being told to?"],
      ["Team feedback ritual in place — with recurring dates and attendance.","Teammate who now gives feedback independently — named, with a before/after observation.","Feedback-giving modelled in team settings — observed by teammates."]),
    p6:L("Fosters a culture of delivering praise and constructive feedback across several teams.",
      ["Establish a feedback norm adopted by at least two teams beyond your own.","Work with team leads on other teams to coach their engineers on feedback quality.","Identify a team where feedback culture is weak and intervene structurally — not just with advice.","Track feedback quality improvement across teams with at least one observable indicator."],
      ["Describe a feedback norm you established across multiple teams. How did you drive adoption?","How do you help a team lead build feedback culture on a team you do not own?","How do you measure whether feedback culture has actually improved across teams?"],
      ["Feedback norm adopted by multiple teams — with adoption dates.","Structural intervention on a weak-feedback team — documented outcome.","Observable indicator of feedback quality improvement across teams."]),
    p7:L("Fosters a culture of delivering praise and constructive feedback across the organization.",
      ["Define and communicate an org-wide feedback standard — what good feedback looks like at LFT.","Measure adoption of the standard across the org with a named indicator.","Hold engineering leads accountable for their team's feedback culture.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide feedback standard would you define? What behaviours does it require?","How do you hold engineering leads accountable for their team's feedback culture?","How do you measure whether the feedback standard is actually practised — not just known?"],
      ["Org-wide feedback standard published — with adoption measurement.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'seeking-feedback',label:'Seeking & Receiving Feedback',levels:{
    p2:L("Actively seeks out feedback from their teammates and manager, and works to use feedback as a tool for growth.",
      ["Ask your manager or a senior teammate for specific feedback at least once per sprint — not just at review time.","Apply feedback visibly within the same sprint it was given.","Record feedback you receive and the action you took on it.","Ask a clarifying question when feedback is unclear — do not guess at its meaning."],
      ["How often do you ask for feedback and what do you ask for specifically?","Describe the last piece of feedback you received. What did you do with it?","What do you do when feedback is vague or unclear?"],
      ["Feedback requests made outside review cycles — at least once per sprint.","Feedback applied visibly within the sprint it was given.","Clarifying questions asked when feedback is unclear — not silent acceptance."]),
    p3:L("Seeks specific, challenging feedback on targeted skills — not general performance — and shows a visible pattern of growth across cycles.",
      ["Request feedback on a specific skill or behaviour — not just 'how am I doing?'.","Show you applied feedback from the previous cycle before asking for new feedback.","Seek feedback from peers who will challenge you — not only from people who agree with you.","Track feedback across cycles and show a pattern of growth."],
      ["Show me a piece of feedback you sought out and applied. What changed as a result?","How do you choose who to ask for feedback and on what?","How do you track feedback across multiple cycles to show growth?"],
      ["Feedback sought on specific skills or behaviours — not general performance.","Evidence of feedback applied — observable in PRs, behaviour, or retro notes.","Feedback tracker or IDP notes showing pattern of growth across cycles."]),
    p4:L("Seeks critical feedback from teammates, manager, and business stakeholders, and turns it into concrete changes in behaviour and decisions.",
      ["Seek feedback from business stakeholders — not only from LFT colleagues.","Reconcile client-given feedback with your LFT manager's record — do not let informal feedback disappear.","Show that feedback from a stakeholder changed a concrete behaviour or decision.","Actively seek critical feedback — not only positive reinforcement."],
      ["Describe seeking feedback from a client stakeholder. What did you ask and how did you use it?","How do you ensure client-given feedback reaches your LFT manager's record?","Describe a piece of critical feedback you sought out. What changed as a result?"],
      ["Feedback sought from business stakeholders — at least one instance per engagement.","Client-given feedback reconciled with LFT manager record — written trail.","Critical feedback sought and applied — with a visible behaviour change."]),
    p5:L("Works within their team and with its business stakeholders to foster a culture of seeking out feedback and using it as a tool for growth. Actively demonstrates these behaviours.",
      ["Model feedback-seeking in team settings — ask for feedback on your own work in front of the team.","Run a team ritual where engineers share feedback they received and what they did with it.","Coach a teammate who does not seek feedback to start — name the specific change you made.","Track whether team members seek feedback outside review cycles."],
      ["Describe a ritual you introduced to make feedback-seeking a team habit.","How do you model feedback-seeking so engineers see it as normal rather than a sign of weakness?","Name a teammate who now seeks feedback more often because of your influence."],
      ["Team feedback-seeking ritual in place — with recurring dates.","Teammate who now seeks feedback independently — named, with before/after observation.","Team feedback-seeking frequency tracked — observable improvement across cycles."]),
    p6:L("Works across several teams and with their business stakeholders to foster this culture.",
      ["Establish a feedback-seeking norm across at least two teams beyond your own.","Work with team leads to make feedback-seeking part of their team's development conversations.","Identify a team where engineers do not seek feedback and intervene structurally.","Track feedback-seeking frequency across teams with a named indicator."],
      ["Describe a feedback-seeking norm you established across multiple teams.","How do you help a team lead build this habit on a team you do not own?","How do you measure whether engineers are actually seeking feedback — not just being asked to?"],
      ["Feedback-seeking norm adopted by multiple teams — with adoption dates.","Structural intervention on a team where engineers did not seek feedback — documented outcome.","Feedback-seeking frequency tracked across teams — observable improvement."]),
    p7:L("Works across the organization to foster this culture.",
      ["Define an org-wide expectation for feedback-seeking — frequency, scope, and how to use it.","Integrate feedback-seeking into the org's performance and development systems.","Hold engineering leads accountable for their team's feedback-seeking culture.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide expectation for feedback-seeking would you define?","How do you integrate feedback-seeking into the org's development systems so it is not optional?","How do you hold engineering leads accountable for their team's feedback-seeking habits?"],
      ["Org-wide feedback-seeking expectation published and integrated into development systems.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'communication',label:'Effective Communication',levels:{
    p2:L("Communicates effectively, clearly, concisely and in an audience-oriented way, in written and verbal form. Actively listens to others and ensures they are understood. Pays attention to nonverbal communication.",
      ["Write a status update a non-engineer can follow without asking a clarifying question.","Listen to a teammate's full point before responding — do not interrupt or redirect early.","Adjust your language when a teammate signals they did not understand you.","Match your communication format to the audience: async for information, sync for decisions."],
      ["Write a status update for this technical situation as if the reader is a project manager.","Describe a time you adjusted how you explained something because it did not land the first time.","How do you decide whether to send a message or schedule a meeting?"],
      ["Written updates read as clear by the intended audience — no follow-up questions for clarification.","Communication format matches the situation — async or sync chosen with a reason.","Adjustments made when a message does not land — observable in follow-up."]),
    p3:L("Usually communicates effectively, clearly, concisely and in an audience-oriented way in written and verbal form on both technical and non-technical subjects.",
      ["Communicate technical topics to a non-technical audience without jargon.","Communicate directly with client stakeholders — write professional, audience-adapted messages.","Produce a handoff note that a teammate in a different timezone can act on without a meeting.","Summarise a complex technical situation in three sentences for a non-technical reader."],
      ["Explain this technical topic to me as if I am a project manager.","Describe a direct communication you had with a client stakeholder. What did you adapt?","Show me a handoff note you wrote. Can the recipient act on it without asking you a question?"],
      ["Client-facing written communications are professional and jargon-free.","Handoff notes are actionable without a follow-up meeting — confirmed by recipients.","Technical summaries land on the first attempt — no clarifying questions from non-technical readers."]),
    p4:L("Communicates effectively, clearly, concisely in written and verbal form on both technical and non-technical subjects, and in an audience-oriented way.",
      ["Explain a technical topic to a non-technical stakeholder and confirm they understood — not just that they nodded.","Proactively manage a client's expectations when a timeline or scope is at risk — before they ask.","Escalate a client-facing risk through the correct channel and in writing — not just verbally.","Adapt client updates to the reader: decision-makers get the summary, engineers get the detail."],
      ["Describe explaining a technical topic to a non-technical audience. How did you confirm they understood — not just that they were listening?","Describe proactively managing a client's expectations on a risk. How early did you raise it?","How do you escalate a client-facing risk so it is on the record?"],
      ["Stakeholder understanding confirmed — follow-up shows comprehension, not just agreement.","Client expectations managed before they asked — written record of the communication.","Client-facing risk escalations in writing — not verbal only."]),
    p5:L("Is able to communicate effectively with a diverse team. Fosters a culture of clear, concise, effective, audience-oriented communication on their team.",
      ["Set and enforce a team communication standard: what goes in async, what goes in sync, how to write a useful update.","Coach a teammate whose communication is unclear — name the specific change you asked for.","Set the client-facing communication tone and escalation standard for the team.","Establish cross-timezone communication norms so no engineer is blocked waiting for a response."],
      ["Describe a communication standard you set on your team. What does it require?","Describe coaching a teammate on their communication. What specific change did you ask for?","How do you set the client-facing tone for your team so everyone communicates consistently?"],
      ["Team communication standard in place — documented and enforced.","Teammate coached on communication — specific change requested and observable.","Cross-timezone communication norms in place — no engineers blocked waiting for responses."]),
    p6:L("Is able to communicate effectively with a diverse set of teams. Fosters a culture of effective communication across several teams.",
      ["Establish a shared communication standard across at least two teams — async/sync norms, update format, escalation paths.","Work with team leads to coach engineers whose communication causes confusion or delays.","Model cross-team communication that is transparent and audience-adapted.","Track communication quality across teams with at least one observable indicator."],
      ["Describe a shared communication standard you established across multiple teams.","How do you help a team lead coach an engineer whose communication is unclear?","How do you measure whether communication quality has improved across teams?"],
      ["Shared communication standard adopted by multiple teams — with adoption dates.","Engineers coached on communication through team leads — before/after observable change.","Observable improvement in cross-team communication quality — named indicator."]),
    p7:L("Is able to communicate effectively across the company. Fosters a culture of effective communication across the company.",
      ["Define an org-wide communication standard covering async vs. sync, update format, escalation paths, and client-facing tone.","Measure adoption of the standard across the org with a named indicator.","Hold engineering leads accountable for their team's communication quality.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide communication standard would you define? What behaviours does it require?","How do you hold engineering leads accountable for their team's communication quality?","How do you measure whether the standard is practised — not just known?"],
      ["Org-wide communication standard published — with adoption measurement.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'knowledge-sharing',label:'Knowledge Sharing',levels:{
    p2:L("Understands their area of work and shares their knowledge frequently with their teammates.",
      ["Share one thing you learned this sprint with at least one teammate — in writing or verbally.","Ask before assuming knowledge is obvious — what is clear to you may not be clear to others.","Write a comment in a PR that teaches a pattern rather than just correcting an error.","Flag a documentation gap when you find one — even if you do not fix it yourself."],
      ["Describe the last thing you shared with a teammate from your area of work.","How do you decide when something you learned is worth sharing?","What do you do when you find a gap in the team's documentation?"],
      ["At least one knowledge share per sprint — in writing or verbally.","PR comments that teach a pattern — not just flag an error.","Documentation gaps flagged when found — even without fixing them."]),
    p3:L("Understands their work domain, shares knowledge frequently, and contributes to their team's documentation. Watches out for opportunities to share knowledge.",
      ["Keep team documentation current in your area — a new page, a corrected section, or an onboarding note when things change.","Proactively share knowledge when you see a teammate struggling with something you know.","Write documentation that a new team member can follow without asking you for a walkthrough.","Identify knowledge that exists only in your head and write it down before it creates a risk."],
      ["Show me a documentation contribution you made recently. What did it add or fix?","Describe a time you proactively shared knowledge with a teammate who did not ask for it.","How do you identify when knowledge in your head is a risk that needs to be written down?"],
      ["Documentation contributions visible in version history during the review period.","Shares knowledge without being asked — confirmed by teammates.","Documentation written to standalone standard — new team member can follow without a walkthrough."]),
    p4:L("Understands their team's domain, shares knowledge frequently, and contributes to their team's documentation. Encourages others to do the same.",
      ["Encourage a teammate to document something they know before they leave the project.","Run short knowledge-sharing sessions — a tech talk, a retro learning share or a demo — when you have something the team needs.","Write documentation that covers your team's full domain, not just your area.","Actively credit the source when you share someone else's knowledge."],
      ["Describe a knowledge-sharing session you ran. What did it cover and who attended?","How do you encourage teammates to document knowledge without it feeling like extra work?","Describe writing documentation that covered more than your own area of the codebase."],
      ["Knowledge-sharing sessions run during the review period, with the topic noted.","Teammates encouraged to document — with a named instance and observable follow-through.","Documentation spans the team's domain — not only the author's assigned area."]),
    p5:L("Fosters a culture of documentation and knowledge sharing within their team and with their team's business stakeholders.",
      ["Run a team documentation standard: what must be documented, in what format, and by when.","Make knowledge sharing a team ritual — a regular slot, a rotation, or a norm.","Extend knowledge sharing to business stakeholders — write stakeholder-facing summaries of key technical decisions.","Coach teammates who do not share knowledge to start — name the specific change you made."],
      ["Describe a documentation standard you set for your team. What does it require and how do you enforce it?","How do you make knowledge sharing feel normal rather than optional on your team?","Describe producing a technical summary for a business stakeholder. What did you include and leave out?"],
      ["Team documentation standard in place — documented and enforced.","Knowledge-sharing team ritual established — recurring cadence with attendance.","Stakeholder-facing technical summaries produced — at least one per significant decision."]),
    p6:L("Fosters a culture of documentation and knowledge sharing across several teams.",
      ["Establish a shared documentation standard across at least two teams — format, cadence, and audience.","Work with team leads to build knowledge-sharing habits on teams you do not own.","Identify a team where knowledge is siloed and intervene structurally — not just with advice.","Track documentation quality across teams with at least one observable indicator."],
      ["Describe a shared documentation standard you established across multiple teams.","How do you help a team lead build knowledge-sharing habits on their team?","How do you identify and address knowledge silos across teams?"],
      ["Shared documentation standard adopted by multiple teams — with adoption dates.","Knowledge silo identified and addressed structurally — documented outcome.","Observable improvement in documentation quality across teams — named indicator."]),
    p7:L("Fosters a culture of documentation and knowledge sharing across the organization.",
      ["Define an org-wide documentation standard — what must be documented, how, and by whom.","Integrate documentation into the org's engineering process so it is not optional.","Hold engineering leads accountable for their team's documentation quality.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide documentation standard would you define?","How do you integrate documentation into the engineering process so teams cannot skip it?","How do you hold engineering leads accountable for documentation quality on their teams?"],
      ["Org-wide documentation standard published and integrated into engineering processes.","Engineering lead accountability conversations documented.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'teamwork',label:'Teamwork',levels:{
    p2:L("Helps their teammates when requested. Gives or shares credit where due.",
      ["Help a teammate when they ask — do not redirect them to documentation before attempting to assist.","Credit your teammates by name when you share work that was collaborative.","Notify the team when your work is blocked so they are not waiting on you silently.","Participate in team ceremonies — standups, retros, and sprint reviews — without being asked."],
      ["Describe the last time a teammate asked for help. What did you do?","How do you give credit to a teammate when you share their work?","What do you do when your work is blocked and you cannot move forward?"],
      ["At least one teammate-help instance per sprint — observed or self-reported.","Credit given by name in demos, PRs, or standups — not general 'the team'.","Blockers communicated to the team on the day they are identified."]),
    p3:L("When requested, helps their teammates overcome obstacles, resolve blockers, and complete work tasks. Gives or shares credit where due. Provides on-call support as determined by Engineering Management.",
      ["Help a teammate overcome a blocker or resolve a task obstacle when they ask — go beyond answering the question to removing the obstacle.","Provide on-call support at the level Engineering Management requires.","Give credit by name when a teammate's work contributed to your output.","Adapt to a client team's existing ways of working — do not impose your own workflow."],
      ["Describe a time you helped a teammate resolve a blocker. What did you do that went beyond just answering a question?","How do you adapt to a client team's workflow when it differs from your own?","Describe an on-call shift. What happened and how did you handle it?"],
      ["Blocker resolutions that went beyond an answer — documented in standup or PR notes.","On-call support delivered at the required level — Engineering Management confirmed.","Credit given by name in shared outputs — confirmed by teammates."]),
    p4:L("Proactively helps their teammates overcome obstacles, resolve blockers, and complete work tasks — without waiting to be asked. Provides on-call support as determined by Engineering Management.",
      ["Proactively help a teammate who is visibly struggling — without waiting for them to ask.","Pair with a teammate on a difficult task to unblock them rather than just advising.","Leave your work easy to pick up: share context and code paths so others can continue without you.","Maintain appropriate boundary discipline when working embedded in a client team."],
      ["Describe a time you helped a teammate proactively — without being asked. What made you notice they needed help?","How do you pair with a teammate on a difficult task rather than just giving advice?","How do you make your work easy for someone else to pick up?"],
      ["Proactive help without being asked — confirmed by teammates.","Pairing sessions that resolved a blocker — with the teammate and task named.","Teammates picked up your work without a walkthrough."]),
    p5:L("Consistently helps their teammates overcome obstacles, resolve blockers, and complete work tasks. Provides on-call support as determined by Engineering Management.",
      ["Consistently unblock teammates before they lose a day to a blocker — same day identification and resolution.","Coach teammates on how to unblock themselves for recurring types of blockers.","Set the standard for how the team works inside a client's team structure — keep engagement-boundary discipline visible.","Track team-level blocker patterns and eliminate recurring causes structurally."],
      ["Describe consistently unblocking teammates. How do you catch blockers before they cost a day?","How do you coach teammates to unblock themselves rather than always coming to you?","How do you set the standard for engagement-boundary discipline on your team?"],
      ["Blockers rarely wait more than a day — confirmed by teammates.","Teammates who now unblock themselves independently — named, with before/after observation.","Engagement-boundary discipline standard set — team follows it without reminders."]),
    p6:L("Consistently works across teams to help them resolve blockers and complete work tasks. Ensures credit is shared where due.",
      ["Identify and resolve cross-team blockers before they delay a sprint.","Ensure credit for cross-team contributions is shared with all involved teams and leads.","Work with team leads to eliminate recurring cross-team blockers structurally.","Track cross-team blocker resolution time and improve it across cycles."],
      ["Describe resolving a cross-team blocker before it delayed a sprint.","How do you ensure credit is shared across teams on collaborative work?","Describe eliminating a recurring cross-team blocker structurally. What was the fix?"],
      ["Cross-team blockers resolved before sprint impact — with dates.","Cross-team credit shared explicitly — in demos, retros, or written summaries.","Recurring cross-team blocker eliminated structurally — before/after data."]),
    p7:L("Consistently works across the organization to enable teams to support each other.",
      ["Enable org-wide mutual support by making it easy for teams to find and help each other.","Install a process that surfaces cross-team blockers before they cause delays.","Ensure credit flows across the org for collaborative work — not just within teams.","Track org-level support health with a named indicator and improve it across cycles."],
      ["How do you enable teams to find and support each other at the org level?","What process would you install to surface cross-team blockers before they cause delays?","How do you ensure collaborative credit flows across the org — not just within teams?"],
      ["Org-level cross-team support process installed — documented and in active use.","Cross-team blockers surfaced before sprint impact — tracked org-wide.","Collaborative credit flowing across teams — observable in org-wide communication."]),
  }},
  {id:'relationships',label:'Relationship Building',levels:{
    p2:L("Works to build strong relationships with their teammates and manager.",
      ["Schedule a 1:1 with your manager at least once per sprint — not only when you have a problem.","Introduce yourself to every teammate on the project within the first week.","Invest time in understanding each teammate's strengths before asking for help.","Follow through on every commitment you make to a teammate — no silent drops."],
      ["How do you build a relationship with a new teammate when you join a project?","How often do you meet with your manager outside of team ceremonies?","What do you do to build trust with a teammate you have not worked closely with yet?"],
      ["1:1 with manager scheduled at least once per sprint — not only when there is a problem.","All project teammates introduced to within the first week — confirmed.","Follow-through on teammate commitments — no silent drops."]),
    p3:L("Works to build strong relationships with their teammates, manager, and product counterpart.",
      ["Build a working relationship with your product counterpart — communicate directly, not through a relay.","Establish a shared way of working with your product counterpart within the first sprint.","Adapt your communication style to each stakeholder you work with regularly.","Surface product-side context to engineering teammates when it changes the work."],
      ["Describe your relationship with your product counterpart. How did you build it?","How do you adapt your communication style when working with a product manager versus a developer?","How do you surface product-side context to your engineering teammates?"],
      ["Direct relationship with product counterpart — not relayed through a senior engineer.","Shared way of working established with product counterpart in the first sprint.","Product-side context surfaced to engineering teammates when it changes the work — at least one instance."]),
    p4:L("Works to build strong relationships with their teammates, manager, and their teams' relevant business stakeholders.",
      ["Identify the business stakeholders relevant to your team's work and build a direct working relationship with each.","Leverage stakeholder relationships to unblock your team — not just for your own work.","Surface technical context to business stakeholders in their language — not engineering jargon.","Maintain stakeholder relationships between project phases — not only during active sprints."],
      ["Name the business stakeholders relevant to your team. How did you build each relationship?","Describe a time you used a stakeholder relationship to unblock your team.","How do you maintain a stakeholder relationship between active project phases?"],
      ["Named business stakeholders with active working relationships — all relevant stakeholders covered.","Stakeholder relationship used to unblock the team — examples from the review period.","Stakeholder relationships maintained between project phases — not dropped until next sprint."]),
    p5:L("Works to build and improve strong relationships with teammates, manager, relevant business stakeholders, and senior engineers across the organization. Leverages relationships to better plan for and position their team.",
      ["Build relationships with senior engineers across the org — at least two outside your own team.","Use those relationships to gather intelligence that improves your team's planning.","Position your team with stakeholders before a problem arises — not only during an escalation.","Leverage relationships to secure resources, unblock cross-team dependencies, or create opportunities for your team."],
      ["Name two senior engineers outside your team you have a working relationship with. How did you build each?","Describe using an org relationship to improve your team's planning or positioning.","How do you position your team with stakeholders before a problem escalates?"],
      ["Relationships with at least two senior engineers outside the team — named, with contact history.","Org relationship used to improve team planning — specific instance with outcome.","Team positioned with stakeholders proactively — before an escalation was needed."]),
    p6:L("Works to build and improve strong relationships with engineers and managers across the organization. Leverages relationships to better plan for and position those teams.",
      ["Build relationships with engineers and managers across multiple teams — not only in your own domain.","Use those relationships to anticipate cross-team dependencies and plan around them.","Position multiple teams with shared stakeholders — not only your own team.","Leverage relationships to resolve cross-team conflicts before they escalate."],
      ["Name three engineers or managers outside your domain you have working relationships with. How did you build each?","Describe using a cross-team relationship to anticipate and plan around a dependency.","Describe using relationships to resolve a cross-team conflict before it escalated."],
      ["Named relationships with engineers and managers across multiple teams — at least three.","Cross-team dependency anticipated and planned around using a relationship — specific instance.","Cross-team conflict resolved using relationships — before escalation needed."]),
    p7:L("Works to build and improve strong relationships across the organization. Leverages those relationships to better plan for and position the engineering organization.",
      ["Build relationships at the executive and business leadership level — not only within engineering.","Use those relationships to position the engineering org in business planning and strategy.","Leverage relationships to resolve org-wide conflicts before they become escalations.","Develop other leaders' relationship-building skills — coach two leads per year."],
      ["Describe relationships you have built at the business leadership level. How did you build them and how do you maintain them?","How do you use executive relationships to position engineering in business planning?","Describe resolving an org-wide conflict using relationships before it escalated."],
      ["Executive and business leadership relationships — named, with contact history.","Engineering org positioned in business planning using relationships — specific instances.","Org-level conflicts resolved using relationships — before escalation."]),
  }},
  {id:'disagreement',label:'Handling Disagreement',levels:{
    p2:L("Openly shares their opinions and contributes to discussions in a respectful manner. Works with teammates to resolve disagreement in a healthy manner. Is open to changing their perspective based on others' input.",
      ["State your opinion in a team discussion at least once per sprint — do not stay silent.","Ask a question to understand a teammate's position before challenging it.","Change your stated position when a teammate presents a stronger argument — do not defend a weak position.","Express disagreement without withdrawing from the conversation or becoming hostile."],
      ["Describe a team discussion where you disagreed with the majority view. What did you say?","How do you challenge a teammate's idea without making it personal?","Describe changing your mind in a team discussion. What convinced you?"],
      ["Opinions stated in team discussions — at least once per sprint.","Questions asked before challenging — not immediate rebuttal.","Position changed when argument was stronger — visible in meeting notes or retro."]),
    p3:L("Openly shares their opinions. Approaches disagreement with teammates non-defensively with inquisitiveness. Uses contradictory opinions as a basis for constructive, productive conversations.",
      ["Ask at least two questions to understand a contradictory view before sharing your own counter-argument.","Use the disagreement to surface assumptions — ask 'what are we each assuming?' rather than 'who is right?'.","Bring a disagreement to a productive conclusion: a decision, a test, or an agreed next step.","Do not let a disagreement stall a decision — escalate when the team cannot resolve it in two conversations."],
      ["Describe navigating a disagreement with a teammate. How did you approach it without being defensive?","How do you use a contradictory opinion to make a conversation more productive rather than more heated?","What do you do when a disagreement cannot be resolved within the team?"],
      ["Disagreements navigated non-defensively — observable in meeting notes or peer feedback.","Contradictory opinions used to surface assumptions — specific instance with outcome.","Disagreements brought to a productive conclusion — decision, test, or next step agreed."]),
    p4:L("Encourages their teammates to openly share their opinions. Approaches disagreement non-defensively with inquisitiveness.",
      ["Create space for a quieter teammate to share their view before a decision is made.","Name the concern behind a surface disagreement — what is actually at stake for each party.","Resolve a disagreement by proposing a testable hypothesis rather than debating positions.","Model intellectual humility: change your position publicly when the evidence warrants it."],
      ["Describe creating space for a quieter teammate to share their view before a decision was made. What specifically did you do?","How do you identify the underlying concern behind a surface disagreement?","Describe proposing a testable hypothesis to resolve a disagreement. What was the outcome?"],
      ["Quieter teammates brought into discussions — specific instance with outcome.","Underlying concern named in a disagreement — visible in meeting notes or design docs.","Testable hypothesis proposed to resolve a disagreement — outcome documented."]),
    p5:L("Fosters a culture within their team where people are encouraged to share opinions, approach disagreement non-defensively, and use contradictory opinions for constructive conversations.",
      ["Run a team retro retrospective moment specifically on how the team handles disagreement — name what is working and what is not.","Coach a teammate who becomes defensive or withdraws in disagreements.","Set a team norm for how disagreements are resolved — escalation path, time limit, decision owner.","Model changing your position publicly so the team sees it as a strength, not a weakness."],
      ["Describe a team norm you set for handling disagreement. What does it require?","Describe coaching a teammate who became defensive in a disagreement. What did you say?","How do you model intellectual humility so the team sees it as a strength?"],
      ["Team disagreement norm in place — documented and followed.","Teammate coached on handling disagreement — specific change requested and observed.","Changes position openly when the evidence warrants it — observed by teammates."]),
    p6:L("Fosters this culture across several teams. Works through surface-level disagreements to expose the concerns of disagreeing voices.",
      ["Identify a cross-team disagreement and work with both leads to surface the underlying concerns.","Facilitate a cross-team conversation that moves from positions to interests.","Establish a cross-team disagreement resolution norm — escalation path and time limit.","Track whether cross-team disagreements are resolved or escalated unnecessarily."],
      ["Describe facilitating a cross-team disagreement to expose underlying concerns. What did you find?","How do you distinguish a genuine disagreement from a misunderstanding at the cross-team level?","Describe a cross-team disagreement resolution norm you established."],
      ["Cross-team disagreement facilitated to underlying concerns — specific instance documented.","Cross-team disagreement resolution norm in place — adopted by involved teams.","Cross-team disagreements tracked: resolved vs. unnecessarily escalated."]),
    p7:L("Fosters this culture across the organization. Integrates disagreeing perspectives from the whole company into their perspective and plans.",
      ["Actively solicit disagreeing perspectives from across the org before finalising a plan.","Name the concerns behind disagreements from different parts of the org — do not dismiss minority views.","Integrate contradictory inputs into a plan that all parts of the org can commit to.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["How do you solicit disagreeing perspectives from across the org before finalising a plan?","Describe integrating contradictory inputs from different parts of the org into a coherent plan.","How do you teach leads to handle disagreement productively on their teams?"],
      ["Disagreeing perspectives solicited org-wide before plan finalisation — documented.","Contradictory inputs integrated into a committed plan — specific instance.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
]},
{id:'leadership',label:'Leadership',subs:[
  {id:'decision-making',label:'Decision Making',levels:{
    p2:L("Understands the impact of biases on decision making. Understands accountability.",
      ["Name two cognitive biases and explain how each distorts a decision.","Explain accountability for outcomes — distinguish owning the result from owning the effort.","Give an example of a decision where a bias could have changed the outcome.","Explain the difference between a good decision and a lucky outcome."],
      ["Name a cognitive bias and describe how it could affect an engineering decision.","What does it mean to be accountable for a decision that did not go as planned?","Describe a decision where you could have been influenced by a bias — what was it?"],
      ["Two cognitive biases named with a concrete effect on a decision — not just a definition.","Accountability explained as owning the outcome — not just the effort.","Distinction made between a good decision process and a good outcome."]),
    p3:L("Strives to be objective and reflects on their own biases when making decisions. Holds themselves accountable for decisions and outcomes.",
      ["Before making a real decision, name the bias most likely to distort your judgment in this situation.","When a decision turns out badly, own the outcome in the post-mortem — do not attribute it to circumstances alone.","Write a decision record for a meaningful technical choice, including alternatives considered.","Seek a second opinion when you notice you are emotionally attached to one option."],
      ["Describe a real decision where you noticed and corrected for your own bias. What changed?","Describe a decision whose outcome did not go as planned. How did you account for it?","Show me a decision record or ADR you wrote. What alternatives did you consider?"],
      ["Real decision named where a bias was noticed — with a specific behaviour change as a result.","Outcome owned in a post-mortem — not attributed only to external factors.","Decision record or ADR written — alternatives visible and reasoned."]),
    p4:L("Reflects on bias as a consistent habit, not only when prompted. Owns team-level technical decisions and their outcomes alongside their manager.",
      ["Apply bias self-reflection as a consistent habit — not only when prompted during reviews.","Own team-level decisions alongside your manager — do not defer accountability upward.","Write decision records for significant choices made on the team.","Name the bias most likely to affect your team's next large decision — not your own alone."],
      ["Describe applying bias self-reflection on multiple decisions across a cycle — not just one.","Describe owning accountability for a team-level decision alongside your manager.","Show me decision records for two significant choices you made this cycle."],
      ["Bias self-reflection applied across the cycle — more than one instance.","Team-level decision owned alongside manager — not deferred upward.","Two or more decision records written — with alternatives and stated rationale."]),
    p5:L("Takes ownership of decisions made in their team by helping teammates make clear decisions in alignment with organizational goals. Raises awareness for how biases impact decisions.",
