function promoTemplate(){
  const cur=LEVELS.find(l=>l.id===S.plv);const tgtId=LEVELS[LEVELS.findIndex(l=>l.id===S.plv)+1].id;const tgt=LEVELS.find(l=>l.id===tgtId);
  const L=[`PROMOTION CASE: [Engineer name], ${cur.code} → ${tgt.code}`,`Review period: [start] to [end] (one or more cycles)`,`Time in ${cur.code}: [months]`,`Manager: [name]   Peer calibrator: [name]`,'',`Summary (3 sentences): what they now do consistently at ${tgt.code}, and the impact.`,'',`Ratings at ${tgt.code} (Meets / Below / Exceeds / N/A).`,`For each: one or two outcomes with dates and links. Completed growth tasks are not evidence on their own.`];
  const assessed=s=>{const c=s.levels[tgtId];return c!==NA&&c&&!c.na;};
  const core=CORE[tgtId];
  if(core)L.push('',`CORE COMPETENCIES (${core.length}, required)`);
  DOMAINS.forEach(d=>{const subs=d.subs.filter(s=>assessed(s)&&(!core||core.includes(s.id)));if(!subs.length)return;
    L.push('',d.label.toUpperCase());subs.forEach(s=>L.push(`- ${s.label}: [rating] | Evidence: [outcome, date, link]`));});
  if(core){L.push('','SUPPORTING COMPETENCIES (optional: list only those with clear evidence)');
    DOMAINS.forEach(d=>d.subs.filter(s=>assessed(s)&&!core.includes(s.id)).forEach(s=>L.push(`- ${s.label}: [rating or leave blank]`)));}
  L.push('','N/A competencies and why: [list]','Peer and client input: [quotes or summaries]','Development areas at the new level: [1–2]','Calibration outcome: [approved / not yet, with reasons]');
  return L.join('\n');
}
function renderPromo(){
  const el=$('content');
  const pairs=LEVELS.slice(0,-2).map((l,i)=>({from:l,to:LEVELS[i+1]}));
  const tgt=LEVELS[LEVELS.findIndex(l=>l.id===S.plv)+1];const ex=PROMO.examples[tgt.id];
  let h=`<div class="kit"><div><h2>Promotion kit</h2><p class="lead">A guide to what the next level looks like, what “Meets” looks like next to a borderline case, and a template for writing the case.</p></div>`;
  h+=`<div class="chips">${pairs.map(p=>`<button class="chip" data-plv="${p.from.id}" aria-pressed="${p.from.id===S.plv}">${p.from.code} → ${p.to.code}</button>`).join('')}</div>`;
  if(LEVEL_SUMMARY[tgt.id])h+=`<div class="lvl-sum"><span><b>${tgt.code} at a glance:</b> ${esc(LEVEL_SUMMARY[tgt.id][0])}</span><span><b>Common trap:</b> ${esc(LEVEL_SUMMARY[tgt.id][1])}</span></div>`;
  h+=`<div class="gsec"><h3>How to use this kit</h3>
    <p>This kit is a guide to what ${tgt.code} looks like. It is <b>not a promotion rule</b>: showing these signals does not guarantee a promotion, which also depends on business need, role availability and calibration.</p>
    <ul>
    <li>Focus on the ${CORE[tgt.id]?'core':'Technical Skills and Delivery'} competencies at ${tgt.code}${CORE[tgt.id]?` (${CORE[tgt.id].length} at this level); supporting ones add colour`:''}.</li>
    <li>Look for a consistent pattern of <b>Meets</b> or <b>Exceeds</b> over time, not a single strong cycle.</li>
    <li>Talk it through with a peer manager so expectations stay consistent across teams.${tgt.id==='p6'?' P6 cases are also discussed with the VP of Engineering.':''}</li></ul>
    <p><b>P7 (Solution Architect)</b> is not reached through promotion, so there is no P6 → P7 case.</p>
    <p><b>N/A:</b> if a competency is N/A because the engineer had no opportunity, the manager should help arrange one, using the growth tasks marked “Works without a project”.</p>
    <p><b>Uneven profiles:</b> strengths in some competencies can balance a gap in others. Discuss the overall picture rather than counting ratings.</p>
    <p><b>Evidence:</b> cite outcomes, such as an incident prevented, a decision that held or a teammate who grew. Completed growth tasks show effort, not readiness. The review period is the cycles behind the case; “examples from the review period” means one or two clear examples, not a count.</p></div>`;
  h+=`<div class="gsec"><h3>Typical time in level</h3><p>A guideline, not a gate. People grow at different speeds.</p><div class="tbl-wrap"><table><thead><tr><th>Move</th><th>Typical time</th></tr></thead><tbody>${PROMO.time_in_level.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></div>`;
  h+=`<div class="gsec"><h3>What “Meets” looks like at ${tgt.code}</h3>`;
  DOMAINS.forEach(d=>{const e=ex[d.id];if(!e)return;h+=`<div class="comp-block"><h4>${esc(d.label)}</h4><div class="pair"><div class="anchor a-strong"><b>Meets</b>${esc(e[0])}</div><div class="anchor a-weak"><b>Borderline: not yet</b>${esc(e[1])}</div></div></div>`;});
  h+=`</div>`;
  h+=`<div class="gsec"><div class="fres-head"><h3>Promotion case template</h3><button class="btn" data-act="copy-promo">Copy template</button></div><pre class="tpl">${esc(promoTemplate())}</pre></div>`;
  h+=`</div>`;el.innerHTML=h;
}

function render(){
  document.body.classList.toggle('sec-other',S.section!=='ic');
  document.querySelectorAll('.sec-tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.sec===S.section));
  const tool=['guide','find','hire','promo','release'].includes(S.view);
  document.body.classList.toggle('tool-view',tool);
  renderSidebar();renderLevelStrip();renderContent();
  if(tool){
    const el=$('content');
    (el.firstElementChild||el).insertAdjacentHTML('afterbegin','<button class="back-btn" data-act="back">← Back to competencies</button>');
    if(S.view==='guide'||S.view==='release'){
      const hs=[...el.querySelectorAll('.guide .gsec>h3')];
      hs.forEach((h3,i)=>{h3.parentElement.id='g'+i;});
      const links=hs.map((h3,i)=>{const t=h3.childNodes[0].textContent.trim();
        return `<a href="#${S.view}" data-toc="g${i}">${esc(t)}</a>`;}).join('');
      el.querySelector('.guide>div:not(.gsec)').insertAdjacentHTML('afterend',`<nav class="toc" aria-label="On this page">${links}</nav>`);
    }
  }
  writeHash();const g=$('guide-btn');g.classList.toggle('active',S.view==='guide');g.setAttribute('aria-pressed',S.view==='guide');[['find-btn','find']].forEach(([b,v])=>{const x=$(b);x.classList.toggle('active',S.view===v);x.setAttribute('aria-pressed',S.view===v);});}

// ─── DEEP LINKS ──────────────────────────────────────────────────────────────
function curSub(){return DOMAINS[S.di].subs[S.si]}
function writeHash(){
  let h;
  if(S.view==='find')h='find/'+S.flv;
  else if(S.view==='promo')h='promotion/'+S.plv;
  else if(S.view==='hire')h='hiring/'+S.hlv;
  else if(S.view==='guide')h='guide';
  else if(S.view==='release')h='release';
  else h='c/'+curSub().id+'/'+S.lv+(S.compare?'/compare':'')+(S.use==='hiring'?'/interview':'');
  try{if(location.hash.slice(1)!==h)history.replaceState(null,'','#'+h);}catch(e){}
}
function readHash(){
  const p=(location.hash||'').slice(1).split('/');const isLv=x=>LEVELS.some(l=>l.id===x);
  if(!p[0])return;
  S.section='ic';S.view='matrix';
  if(p[0]==='find'){S.view='find';if(isLv(p[1]))S.flv=p[1];}
  else if(p[0]==='promotion'){S.view='promo';if(['p2','p3','p4','p5'].includes(p[1]))S.plv=p[1];}
  else if(p[0]==='hiring'){S.view='hire';if(isLv(p[1]))S.hlv=p[1];}
  else if(p[0]==='guide')S.view='guide';
  else if(p[0]==='release')S.view='release';
  else if(p[0]==='c'){
    DOMAINS.forEach((d,di)=>d.subs.forEach((s,si)=>{if(s.id===p[1]){S.di=di;S.si=si;}}));
    if(isLv(p[2]))S.lv=p[2];
    S.compare=p.includes('compare');S.use=p.includes('interview')?'hiring':'promotion';
  }
}
window.addEventListener('hashchange',()=>{readHash();render();});

// ─── MODE TOGGLE ─────────────────────────────────────────────────────────────
function toggleMode(){
  S.mode=S.mode==='competency'?'level':'competency';
  render();
  if(S.mode==='level'){
    // scroll sidebar to active item
    requestAnimationFrame(()=>{
      const a=$('sub-list').querySelector('[aria-current="true"]');
      if(a)a.scrollIntoView({block:'nearest'});
    });
  }
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
function openSearch(){
  $('search-modal').hidden=false;
  requestAnimationFrame(()=>$('modal-input').focus());
}
function closeSearchModal(){$('search-modal').hidden=true;}

function doSearch(){
  const q=$('modal-input').value.toLowerCase().trim();
  const out=$('modal-results');
  if(q.length<2){out.innerHTML='<p class="sr-empty">Type at least 2 characters…</p>';return;}
  const results=[];
  const seen=new Set();
  DOMAINS.forEach((d,di)=>{
    d.subs.forEach((s,si)=>{
      LEVELS.forEach(l=>{
        const cell=s.levels[l.id];
        if(!cell||cell===NA||cell===SEE_P4||cell.na)return;
        const fields=[cell.expectation||'',...(cell.rubric||[]),...(cell.questions||[]),...(cell.evidence||[])];
        for(const f of fields){
          if(f.toLowerCase().includes(q)){
            const key=`${di}-${si}-${l.id}`;
            if(!seen.has(key)){
              seen.add(key);
              const idx=f.toLowerCase().indexOf(q);
              const pre=esc(f.substring(Math.max(0,idx-35),idx));
              const hit=esc(f.substring(idx,idx+q.length));
              const post=esc(f.substring(idx+q.length,Math.min(f.length,idx+q.length+65)));
              results.push({di,si,lv:l.id,domain:d.label,sub:s.label,code:l.code,pre,hit,post});
            }
            break;
          }
        }
      });
    });
  });
  if(!results.length){out.innerHTML=`<p class="sr-empty">No results for "${esc(q)}".</p>`;return;}
  out.innerHTML=results.slice(0,25).map(r=>
    `<button class="sr-item" data-di="${r.di}" data-si="${r.si}" data-lv="${r.lv}">
      <div class="sr-meta">${esc(r.domain)} › ${esc(r.sub)} · ${r.code}</div>
      <div class="sr-snippet">…${r.pre}<strong>${r.hit}</strong>${r.post}…</div>
    </button>`
  ).join('');
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
$('sub-list').addEventListener('click',e=>{
  const b=e.target.closest('[data-si]');if(!b)return;
  S.di=+b.dataset.di;S.si=+b.dataset.si;S.view='matrix';render();$('content').scrollTop=0;
});
$('side-select').addEventListener('change',e=>{const [di,si]=e.target.value.split('.').map(Number);S.di=di;S.si=si;S.view='matrix';render();});
$('side-filter').addEventListener('input',e=>{S.sfilter=e.target.value;renderSidebar();});
$('level-strip').addEventListener('click',e=>{
  const act=e.target.closest('[data-act="compare"]');
  if(act){S.compare=!S.compare;render();return;}
  const ln=e.target.closest('.lvl-note');if(ln){ln.classList.toggle('open');return;}
  const u=e.target.closest('[data-use]');
  if(u){S.use=u.dataset.use;render();return;}
  const b=e.target.closest('[data-lv]');if(!b)return;
  S.lv=b.dataset.lv;if(S.lv==='p7')S.compare=false;render();
});
$('guide-btn').addEventListener('click',()=>{S.view=S.view==='guide'?'matrix':'guide';render();});
if($('promo-btn'))$('promo-btn').addEventListener('click',()=>{if(S.view!=='promo')S.plv=['p6','p7'].includes(S.lv)?'p5':S.lv;S.view=S.view==='promo'?'matrix':'promo';render();$('content').scrollTop=0;});
if($('hire-btn'))$('hire-btn').addEventListener('click',()=>{if(S.view!=='hire')S.hlv=S.lv;S.view=S.view==='hire'?'matrix':'hire';render();$('content').scrollTop=0;});
$('find-btn').addEventListener('click',()=>{if(S.view!=='find')S.flv=S.lv;S.view=S.view==='find'?'matrix':'find';render();$('content').scrollTop=0;});
$('content').addEventListener('click',e=>{
  const toc=e.target.closest('[data-toc]');if(toc){e.preventDefault();const t=document.getElementById(toc.dataset.toc);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return;}
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.flv){S.flv=t.dataset.flv;renderFinder();return;}
  if(t.dataset.hlv){S.hlv=t.dataset.hlv;renderHiring();return;}
  if(t.dataset.plv){S.plv=t.dataset.plv;renderPromo();return;}
  if(t.dataset.fsub){const id=t.dataset.fsub;S.fsubs=S.fsubs.includes(id)?S.fsubs.filter(x=>x!==id):S.fsubs.concat(id).slice(0,3);renderFinder();return;}
  if(t.dataset.ff){const id=t.dataset.ff;S.ff=S.ff.includes(id)?S.ff.filter(x=>x!==id):S.ff.concat(id);renderFinder();return;}
  if(t.dataset.open){
    DOMAINS.forEach((d,di)=>d.subs.forEach((s,si)=>{if(s.id===t.dataset.open){S.di=di;S.si=si;}}));
    const fromHire=S.view==='hire';S.lv=t.dataset.lv||S.flv;S.view='matrix';S.compare=false;S.use=fromHire?'hiring':'promotion';render();$('content').scrollTop=0;return;
  }
  const act=t.dataset.act;
  if(act==='back'){S.view='matrix';render();$('content').scrollTop=0;return;}
  if(act==='copy-hiring'){copyText(hiringText(),'Interview pack copied');return;}
  if(act==='copy-promo'){copyText(promoTemplate(),'Template copied');return;}
  if(act==='clear-subs'){S.fsubs=[];renderFinder();return;}
  if(act==='find-from'){S.flv=S.lv;S.fsubs=[t.dataset.sub];S.view='find';render();$('content').scrollTop=0;return;}
  if(act==='copy-tasks'){
    const txt=finderText(finderResults());
    const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Tasks copied');}catch(_){toast('Copy failed');}ta.remove();};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Tasks copied'),fallback);else fallback();
  }
});
$('search-btn').addEventListener('click',openSearch);
$('modal-overlay').addEventListener('click',e=>{if(e.target===$('modal-overlay'))closeSearchModal();});
$('modal-input').addEventListener('input',doSearch);
$('modal-results').addEventListener('click',e=>{
  const b=e.target.closest('[data-di]');if(!b)return;
  S.di=+b.dataset.di;S.si=+b.dataset.si;S.lv=b.dataset.lv;S.view='matrix';S.compare=false;S.section='ic';
  closeSearchModal();render();$('content').scrollTop=0;
});
document.addEventListener('keydown',e=>{
  if(!$('search-modal').hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    const items=[...$('modal-results').querySelectorAll('.sr-item')];if(!items.length)return;
    e.preventDefault();let i=items.indexOf(document.activeElement);
    i=e.key==='ArrowDown'?Math.min(items.length-1,i+1):Math.max(-1,i-1);
    (i<0?$('modal-input'):items[i]).focus();return;
  }
  if(e.key==='Escape'&&!$('search-modal').hidden){closeSearchModal();}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();openSearch();}
});

readHash();
render();
</script>

</body>
