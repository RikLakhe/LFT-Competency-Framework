<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFT Competency Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg:#F0F2F5;--surface:#FFFFFF;--surface-2:#E8EBF0;--line:#D4D9E2;
  --fg:#1A2233;--fg-2:#3D4A5C;--fg-3:#6B7688;
  --accent:#2851A3;--accent-soft:#E5EDFF;--accent-mid:#3D68C8;--on-accent:#FFFFFF;
  --green:#1D7A4F;--green-soft:#E2F4EC;
  --amber:#7A4F00;--amber-soft:#FFF3D6;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;--shadow:0 1px 3px rgba(10,20,50,0.10),0 0 0 1px rgba(10,20,50,0.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151B;--surface:#1C2030;--surface-2:#242840;--line:#2E3448;
  --fg:#E2E6F0;--fg-2:#9AA5BC;--fg-3:#5C6880;
  --accent:#6B9EFF;--accent-soft:#1A2A4A;--accent-mid:#5A8AEF;--on-accent:#0A1220;
  --green:#5ECFA4;--green-soft:#0D2B1F;
  --amber:#FFCA6B;--amber-soft:#2B2000;
  --shadow:0 1px 4px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.04);
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── TOP NAV ─────────────────────────────────────────── */
.topnav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding-inline:16px;height:48px;flex-shrink:0;gap:0}
.brand{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--accent);display:flex;align-items:center;padding-right:20px;border-right:1px solid var(--line);margin-right:4px;white-space:nowrap;letter-spacing:-.01em}
.domain-tabs{display:flex;gap:0;align-self:stretch;overflow-x:auto;scrollbar-width:none}
.domain-tabs::-webkit-scrollbar{display:none}
.dtab{border:0;background:none;padding:0 16px;font-size:13.5px;font-weight:600;color:var(--fg-3);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;transition:color .12s}
.dtab:hover{color:var(--fg)}
.dtab[aria-current="true"]{color:var(--accent);border-color:var(--accent)}
.lvl-inline-title{font-size:11px;font-weight:400;opacity:.7}
@media(max-width:560px){.lvl-inline-title{display:none}}

/* ── BODY LAYOUT ─────────────────────────────────────── */
.app-body{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden;min-height:0}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:14px 14px 8px;flex-shrink:0}
.sidebar-head .domain-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-3);display:block;margin-bottom:8px}
.sidebar-search{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:6px 10px;font-size:13px;color:var(--fg);outline:none}
.sidebar-search:focus{border-color:var(--accent)}
.sidebar-search::placeholder{color:var(--fg-3)}
.sub-list{flex:1;overflow-y:auto;padding:4px 8px 16px;display:flex;flex-direction:column;gap:2px}
.sub-list::-webkit-scrollbar{width:4px}
.sub-list::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.sub-item{border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--fg-2);display:flex;align-items:center;gap:10px;transition:background .1s}
.sub-item:hover{background:var(--surface-2)}
.sub-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sub-item .sub-num{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);min-width:18px}
.sub-item[aria-current="true"] .sub-num{color:var(--accent-mid)}

/* ── MAIN AREA ───────────────────────────────────────── */
.main{display:flex;flex-direction:column;overflow:hidden;min-height:0;min-width:0}
.sidebar,.content-scroll,.card,.sections-grid,.section{min-width:0}
.section li,.cmp-col li{overflow-wrap:anywhere}

/* level tabs strip */
.level-strip{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:4px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;height:52px}
.level-strip::-webkit-scrollbar{display:none}
.lvl-tab{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13px;color:var(--fg-3);display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .12s,color .12s;white-space:nowrap;min-width:70px}
.lvl-tab .lcode{font-family:var(--font-mono);font-size:14px;font-weight:700}
.lvl-tab .ltitle{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.lvl-tab:hover{background:var(--surface-2);color:var(--fg)}
.lvl-tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lvl-tab[aria-pressed="true"] .ltitle{color:rgba(255,255,255,.75)}
.lvl-divider{width:1px;height:28px;background:var(--line);margin:0 4px;flex-shrink:0}

/* scroll area */
.content-scroll{flex:1;overflow-y:auto;padding:24px}
.content-scroll::-webkit-scrollbar{width:6px}
.content-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* ── CARD ────────────────────────────────────────────── */
.card{display:grid;gap:14px;max-width:960px}

.exp-band{border-radius:var(--r);padding:16px 20px;border-left:4px solid var(--accent);background:var(--accent-soft);margin-bottom:2px}
.exp-band .elabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-mid);margin-bottom:5px}
.exp-band .etext{margin:0;font-size:15px;color:var(--fg);line-height:1.7;font-style:italic}

.sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.section.full{grid-column:1/-1}
.section .sh{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.section .sh::after{content:'';flex:1;height:1px;background:var(--line)}
.section ul,.section ol{margin:0;padding-left:18px;display:grid;gap:9px}
.section li{font-size:14px;color:var(--fg-2);line-height:1.65}
.section ol{padding-left:20px}
.section li::marker{color:var(--accent);font-weight:700}

.na-card{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:40px;text-align:center;color:var(--fg-3);font-size:14px}
.seep4-note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);padding:10px 16px;font-size:13px;color:var(--amber);margin-bottom:2px;font-weight:600}

.card-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.card-header h2{margin:0;font-size:20px;font-weight:700}
.scope-chip{font-size:12px;color:var(--fg-3);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

/* ── EMPTY STATE ─────────────────────────────────────── */
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--fg-3)}
.coming-soon strong{font-size:16px;color:var(--fg-2)}

/* ── TOPNAV ACTIONS ──────────────────────────────────── */
.topnav-actions{display:flex;align-items:center;gap:6px;margin-left:auto;padding-left:12px;flex-shrink:0}
.icon-btn{border:0;background:none;padding:8px;border-radius:8px;color:var(--fg-3);display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mode-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--fg-2);display:flex;align-items:center;gap:6px;transition:background .12s,color .12s;white-space:nowrap}
.mode-btn:hover{background:var(--surface-2);color:var(--fg)}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ── SEARCH MODAL ────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:72px;backdrop-filter:blur(3px)}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,calc(100vw - 32px));box-shadow:0 12px 48px rgba(0,0,0,.3);max-height:68vh;display:flex;flex-direction:column;overflow:hidden}
.modal-search-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-search-row svg{width:18px;height:18px;stroke:var(--fg-3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.modal-input{border:0;background:none;font:inherit;font-size:16px;color:var(--fg);flex:1;outline:none}
.modal-input::placeholder{color:var(--fg-3)}
.modal-results{flex:1;overflow-y:auto;padding:8px}
.modal-results::-webkit-scrollbar{width:4px}
.modal-results::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.sr-item{width:100%;border:0;background:none;text-align:left;padding:10px 14px;border-radius:8px;cursor:pointer;transition:background .1s;display:block}
.sr-item:hover{background:var(--surface-2)}
.sr-meta{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px;font-family:var(--font-mono);letter-spacing:.02em}
.sr-snippet{font-size:13px;color:var(--fg-2);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-snippet strong{color:var(--fg);background:var(--accent-soft);border-radius:3px;padding:0 2px}
.sr-empty{padding:28px;text-align:center;color:var(--fg-3);font-size:13px;margin:0}
.modal-hint{padding:10px 18px;font-size:11px;color:var(--fg-3);border-top:1px solid var(--line);display:flex;gap:16px;flex-shrink:0}
.modal-hint kbd{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}

/* ── LEVEL-MODE SIDEBAR GROUPS ───────────────────────── */
.sdomain-group{margin-bottom:4px}
.sdomain-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--fg-3);padding:10px 10px 4px;display:block}

/* ── MOBILE ──────────────────────────────────────────── */
@media(max-width:768px){
  body{overflow:auto;height:auto}
  .app-body{grid-template-columns:1fr;overflow:visible}
  .sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow:visible}
  .sub-list{flex-direction:row;flex-wrap:wrap;gap:6px;padding:8px}
  .sub-item{padding:6px 10px;font-size:12px}
  .sub-item .sub-num{display:none}
  .main{overflow:visible}
  .content-scroll{overflow:visible;padding:16px}
  .sections-grid{grid-template-columns:1fr}
  .section.full{grid-column:1}
  .lvl-tab .ltitle{display:none}
  .lvl-tab{min-width:44px;padding:6px 8px}
}

/* ── v1.1 ADDITIONS ──────────────────────────────────── */
.brand .ver{font-size:10px;color:var(--fg-3);margin-left:6px}
.lvl-tab.is-na{opacity:.45}
.strip-tools{margin-left:auto;display:flex;gap:8px;align-items:center;padding-left:12px;flex-shrink:0}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--fg-2);white-space:nowrap}
.chip-btn:hover{background:var(--surface-2)}
.chip-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 12px;font-size:12px;font-weight:700;color:var(--fg-3);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.info-note{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--fg-3);border-radius:var(--r);padding:10px 16px;font-size:13px;color:var(--fg-2)}
.info-note strong{color:var(--fg)}
.sh .sh-hint{font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--fg-3);order:2}
.q-internal{opacity:.5}
.q-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--fg-3)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start}
.cmp-col.next{border-color:var(--accent)}
.cmp-head{display:flex;align-items:baseline;gap:8px}
.cmp-head .lcode{font-family:var(--font-mono);font-weight:700;font-size:16px;color:var(--accent)}
.cmp-head .lt{font-size:12px;color:var(--fg-3)}
.cmp-exp{margin:0;font-style:italic;font-size:14px;color:var(--fg);line-height:1.65}
.cmp-col ul{margin:0;padding-left:18px;display:grid;gap:8px}
.cmp-col li{font-size:13.5px;color:var(--fg-2)}
.cmp-col li::marker{color:var(--accent)}
.guide{max-width:880px;display:grid;gap:18px}
.guide h2{margin:0;font-size:22px}
.guide h3{margin:0 0 8px;font-size:15px}
.guide p{margin:0 0 8px;color:var(--fg-2);font-size:14px}
.guide .gsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.guide ul,.guide ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--fg-2)}
.guide .draft{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber);border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle}
.tbl-wrap{overflow-x:auto}
.guide table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
.guide th,.guide td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;color:var(--fg-2)}
.guide th{color:var(--fg);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.guide td:first-child{color:var(--fg);font-weight:700}
@media(max-width:768px){
  .compare-grid{grid-template-columns:1fr}
  .strip-tools{padding-left:8px}
  .section.full ul{grid-template-columns:1fr!important}
  .topnav{flex-wrap:wrap;height:auto}
  .brand{border-right:0;padding:10px 0}
  .domain-tabs{order:3;width:100%;height:40px}
}

/* ── v1.2 GROWTH TASKS & FINDER ──────────────────────── */
.growth{display:grid;gap:12px}
.growth-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.growth-head .sh{margin:0;flex:1;min-width:200px}
.gt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gt{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.gt-kind{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.k-quick{color:var(--green)}.k-stretch{color:var(--accent)}.k-next{color:var(--amber)}
.gt-time{font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg-3);font-size:11px}
.gt h4{margin:0;font-size:14.5px;color:var(--fg);line-height:1.35}
.gt p{margin:0;font-size:13.5px;color:var(--fg-2);line-height:1.55}
.gt .why{font-size:13px;color:var(--fg);font-style:italic}
.gt .box{font-size:12.5px;color:var(--fg-2);background:var(--surface-2);border-radius:6px;padding:6px 9px}
.gt .box b{color:var(--fg)}
.gt .toward{font-size:11.5px;color:var(--fg-3)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--fg-2);background:var(--surface)}
.tag.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.tag.good{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.link-btn{border:0;background:none;color:var(--accent);font-size:12px;font-weight:700;padding:0}
.finder{max-width:1040px;display:grid;gap:16px}
.finder h2{margin:0;font-size:22px}
.finder .lead{margin:4px 0 0;color:var(--fg-2);font-size:14px}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.fstep h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--fg-2)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.cgroup{display:grid;gap:6px}
.cgroup .gl{font-size:11px;font-weight:700;color:var(--fg-3)}
.fres-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.fres-head h3{margin:0;font-size:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.btn:hover{background:var(--surface-2)}
.fcomp{display:grid;gap:10px}
.fcomp h4{margin:6px 0 0;font-size:15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:200}
@media(max-width:900px){.gt-grid{grid-template-columns:1fr}}

/* ── v1.3 KITS ───────────────────────────────────────── */
.gt-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))!important}
.gt.is-bench{border-style:dashed;background:var(--surface-2)}
@media(max-width:1440px){.dtab{padding:0 10px;font-size:13px}.brand{padding-right:12px}}
.guide>*,.kit>*,.finder>*,.kit .gsec>*{min-width:0}
.k-bench{color:var(--fg-2)}
.kit{max-width:1040px;display:grid;gap:16px}
.kit h2{margin:0;font-size:22px}
.kit .lead{margin:4px 0 0;color:var(--fg-2);font-size:14px}
.kit .gsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:10px}
.kit h3{margin:0;font-size:15px}
.kit p{margin:0;color:var(--fg-2);font-size:14px}
.kit ul,.kit ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--fg-2)}
.kit table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
.kit th,.kit td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;color:var(--fg-2)}
.kit th{color:var(--fg);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kit td:first-child{color:var(--fg);font-weight:700}
.kit .draft{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber);border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle}
.anchor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.anchor{border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5}
.anchor b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.a-strong{background:var(--green-soft);color:var(--fg)}.a-strong b{color:var(--green)}
.a-ok{background:var(--accent-soft);color:var(--fg)}.a-ok b{color:var(--accent)}

{id:'technical',label:'Technical Skills',subs:[
  {id:'writing-code',label:'Writing Code',levels:{
    p2:L("Writes code with testability, readability, edge cases, and errors in mind.",
      ["Handle at least one edge case and one error path in every function you write.","Name every variable and function so its purpose is clear without a comment.","Write code that a reviewer can follow without a verbal walkthrough from you.","Match the client codebase's naming and style conventions — not your own preferences."],
      ["Write a function for this task. Walk me through how you handle the error case.","Look at this codebase. What naming conventions do you see? Would you follow them on a new function?","Show a recent PR. Which edge cases did you cover and how did you verify each one?"],
      ["PR shows explicit error branches alongside the happy path.","Code is readable without the author present to explain it.","Variable and function names match the client codebase's existing conventions."]),
    p3:L("Consistently writes functions that are easily testable, easily understood by other developers, and accounts for edge cases and errors. Uses docstrings effectively.",
      ["Write docstrings that explain non-obvious function intent only — not what the code does.","Leave self-evident code without comments.","Cover edge cases and error paths in every function, without guidance.","Apply a new client codebase's naming and style conventions within the engagement ramp-up window."],
      ["Show a function with a docstring you wrote. What does it explain and why is that not obvious from the code itself?","When do you add a comment instead of renaming a variable?","Describe adapting your coding style to match a client codebase. What specifically did you change?"],
      ["Docstrings explain non-obvious intent — not mechanics the code already shows.","Comments absent from self-evident code lines.","Client codebase conventions applied consistently from the first PR of the engagement."]),
    p4:L("Consistently writes production-ready code that is easily testable, easily understood by other developers, and accounts for edge cases and errors. Understands when it is appropriate to leave comments, but biases towards self-documenting code.",
      ["Write production-ready, self-documenting code across a full feature — not just individual functions.","Add comments only for non-obvious rationale — never for what the code does.","Design code to be testable: use dependency injection, avoid hidden side effects.","Apply the client codebase's conventions consistently across every file in the feature, not just assigned files."],
      ["Show a production PR. Point to where you chose a name or structure over a comment.","How do you decide when self-documenting code is not enough and a comment is needed?","Show me how you make code independently testable when working inside an existing codebase."],
      ["PRs show self-documenting code with sparse, rationale-only comments.","Functions are independently testable — no hidden global state or external service coupling.","Style is consistent with the client codebase across the entire feature."]),
    p5:L("Holds the P4 bar personally and sets the code quality bar for the team. Still writes code for the most critical or risky parts of the system.",["Write the code for the riskiest or most critical part of at least one feature per cycle.","Define what production-ready means for the team and hold reviews to it.","Keep review turnaround fast enough that you are not a bottleneck.","Refactor one hotspot that slows the team down and measure the improvement."],["Which part of the system did you code yourself last cycle, and why that part?","How did you define production-ready for your team?","Describe a refactor you led. How did you measure the improvement?"],["PRs on critical or risky paths authored by you.","Team production-ready definition in the repo.","Hotspot refactor with a before-and-after measure."]),
    p6:L("Writes code where it matters most across teams: reference implementations, hard cross-team problems and shared libraries. Raises code quality across several teams.",["Build a reference implementation or shared library that at least two teams adopt.","Personally solve at least one hard cross-team technical problem each half-year.","Review high-risk changes on other teams when asked.","Set code quality signals that several teams track."],["Describe a reference implementation or shared library you built. Who adopted it?","Tell me about the hardest cross-team technical problem you solved hands-on.","How do you stay hands-on while working across teams?"],["Reference implementation or shared library with adopting teams named.","Cross-team technical problem solved, with your commits.","Code quality signals tracked across teams."]),
    p7:L("Stays technically credible across the organisation: builds prototypes, spikes and reference architectures for the hardest problems, and sets the code quality bar organisation-wide.",["Build a prototype or spike for at least one high-risk technical bet each half-year.","Produce reference architectures with working code, not only diagrams.","Read and review code across teams often enough to spot organisation-wide patterns.","Set and explain the organisation's code quality bar."],["Describe a prototype or spike you built for a technical bet. What did it prove?","How do you stay close to the code at organisation scope?","What organisation-wide code pattern have you changed, and how?"],["Prototypes or spikes, with the decisions they informed.","Reference architectures with working code.","Organisation code quality bar published with its rationale."]),
  }},
  {id:'testing',label:'Testing',levels:{
    p2:L("Knows the testing pyramid. Writes unit tests, sometimes with help from more senior engineers.",
      ["Name the three layers of the testing pyramid and the proportion each layer should occupy.","Write a unit test for a new function using the team's test framework, with guidance.","Test at least one edge case and one error path per unit test — not just the happy path.","Follow the client codebase's test naming and fixture conventions — do not introduce your own."],
      ["What is the testing pyramid? Name each layer and explain why the proportions matter.","Write a unit test for this function. Which edge cases would you cover?","Look at this test file. What naming conventions does the team use and would you follow them?"],
      ["Unit tests present for all new functions in PRs.","At least one edge case and one error path covered per test.","Test naming matches the client codebase's existing convention."]),
    p3:L("Understands the testing pyramid, writes unit tests in accordance with it, as well as higher level tests with help from more senior engineers. Always tests expected edge cases and errors as well as the happy path.",
      ["Write unit and higher-level tests unaided, covering edge cases and error paths in addition to the happy path.","Onboard to a new client's test suite and write conforming tests within the engagement ramp-up window.","Use synthetic or masked data in fixtures — never live client data.","Explain which pyramid layer each test belongs to and why."],
      ["Show a PR where you wrote tests independently. Which pyramid layers did you cover and why?","How do you ensure test fixtures never contain live client data?","Describe onboarding to a new client's test framework. What did you change about your usual approach?"],
      ["PRs cover edge cases and error paths — not just the happy path.","Fixtures use synthetic or masked data — verified before merge.","Test suite conforms to client conventions from the first PR of the engagement."]),
    p4:L("Designs test suites for whole features across pyramid layers, keeps them deterministic, and adapts the approach to client frameworks and CI constraints.",
      ["Write a test suite spanning at least two pyramid layers for a feature.","Make each test deterministic — no shared state, no calls to live external services.","Adapt your testing approach when the client mandates a specific framework or CI constraint.","Explain coverage decisions in the PR description."],
      ["Walk me through a test suite you designed for a feature. Which layers did you include and why?","Describe a time a client's CI or framework constraint changed your testing approach. What did you do?","How do you keep a test suite from becoming flaky as the codebase grows?"],
      ["Feature-level test suites span multiple pyramid layers.","Tests are deterministic — no external service calls or shared state.","PR descriptions explain coverage rationale and layer decisions."]),
    p5:L("Understands their team's testing approach, and uses quality metrics to identify gaps. Works with their team to recommend solutions that are in accordance with accepted testing frameworks and the testing pyramid.",
      ["Identify a testing gap using a quality metric — not intuition or personal observation alone.","Recommend a specific pyramid-aligned fix for the gap and present it to the team.","Facilitate a team conversation to agree on the fix.","Measure the metric before and after the change to confirm improvement."],
      ["Describe a testing gap you identified using data. Which metric pointed to it?","How did you get the team to agree on the fix?","How did you measure whether the change actually improved quality?"],
      ["Quality metric report showing the identified gap before intervention.","RFC or team standard documenting the agreed fix.","Before-and-after metric comparison showing improvement."]),
    p6:L("Understands the testing approach of several teams, and uses quality metrics to identify gaps. Influences organization-wide testing strategy.",
      ["Identify testing gaps across at least two teams using shared quality metrics.","Propose a converged testing strategy that each affected team can adopt within their constraints.","Work with each team lead to adapt the strategy — do not impose a single template.","Track adoption and metric improvement across teams after the strategy change."],
      ["Describe a cross-team testing strategy you proposed. How did you account for each team's constraints?","How did you measure adoption of the strategy across teams?","What did you do when a team resisted the change?"],
      ["Cross-team testing strategy document with per-team adoption plan.","Quality metric trends across teams after strategy change.","Named contacts at each team who adopted the standard."]),
    p7:L("Understands organizational testing approach, and uses quality metrics to identify gaps. Drives organization-wide testing strategy.",
      ["Set an org-wide testing standard with explicit, measurable adherence criteria.","Define a mechanism to measure team adherence — not just a published document.","Hold teams accountable when adherence falls below the threshold.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide testing standard would you set? How would you measure adherence?","How would you handle a team that consistently falls below the adherence threshold?","How do you connect the testing standard to business delivery outcomes for an executive audience?"],
      ["Published org-wide testing standard — versioned, with explicit adherence criteria.","Adherence measurement dashboard or recurring report covering all teams.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'debugging',label:'Debugging',levels:{
    p2:L("Understands the basics of debugging and the tools used for it.",
      ["Reproduce the reported bug from the ticket description before attempting any fix.","Use a debugger or logging tool to isolate the failure location in familiar code, with guidance.","Distinguish the symptom from the root cause before writing the fix.","Ask clarifying questions when the bug report is too vague to reproduce."],
      ["Walk me through how you approach a vague bug report. What is the first thing you do?","What tools do you use to isolate a bug? Show me on this example.","What is the difference between a symptom and a root cause? Give me a concrete example."],
      ["PRs reference a reproduction step — not just the fix.","Debugging session notes show the isolation process, not just the answer.","Bug descriptions distinguish symptom from root cause."]),
    p3:L("Uses a systematic approach to debug issues located within a single service.",
      ["Apply a named systematic method — bisection, log correlation, or reproduction narrowing — to every bug.","Debug an issue within a single service without guidance.","Orient to an unfamiliar client's logging and monitoring tooling without requiring it to match a prior project.","Write a clear reproduction case before starting the fix."],
      ["Walk me through debugging this seeded bug. Name each step of your method.","Describe orienting to an unfamiliar logging tool on a client project. How did you get started?","How do you write a reproduction case when you only have a user complaint as input?"],
      ["PR descriptions include a reproduction case and a root cause statement.","Debugging session notes name the method used at each step.","Evidence of orienting to client tooling on at least one engagement without prior experience."]),
    p4:L("Proficient at using systematic debugging to diagnose all issues located to a single service. Diagnoses cross-service issues, sometimes with help from more senior engineers.",
      ["Diagnose a cross-service issue — escalate only when you cannot proceed with the access available.","Work within client production-access restrictions: request minimum access, not maximum.","Write a root cause statement that separates symptom, trigger, and underlying cause.","Use the client's monitoring and logging tooling as your primary debug surface."],
      ["Describe a cross-service issue you diagnosed. How did you trace it across service boundaries?","How do you debug in a client environment where you have restricted production access?","Show me your approach to this cross-service bug scenario."],
      ["Postmortem or bug write-up separating symptom, trigger, and root cause.","Evidence of working within client production-access restrictions.","Cross-service diagnosis completed with appropriate escalation decision documented."]),
    p5:L("Proficient at using systematic debugging to diagnose all issues within the scope of their domain.",
      ["Diagnose any issue within the team's domain scope without escalation.","Judge correctly which issues are in-domain versus genuinely requiring another team.","Lead a domain-scoped incident to resolution and produce the postmortem.","Explain the domain boundary to a new engineer clearly enough for them to make the same judgment."],
      ["Describe a diagnosis where you had to judge whether it was in your domain or needed another team. How did you decide?","Walk me through leading a domain-scoped incident to resolution.","How do you explain your team's domain boundaries to a new team member?"],
      ["Domain incidents led to resolution without unnecessary escalation — examples from the review period.","Postmortems filed for domain incidents, including domain boundary reasoning.","Onboarding material or documentation explaining domain scope and escalation triggers."]),
    p6:L("Proficient at using systematic debugging to diagnose all issues within a set of related domains.",
      ["Diagnose an issue spanning at least two teams' domains without escalation.","Coordinate cross-team debugging without taking ownership of another team's domain.","Identify where a cross-domain issue originates and assign the fix to the correct team.","Produce a cross-team postmortem with contributing-cause attribution to each domain."],
      ["Describe a cross-domain issue you diagnosed. How did you coordinate with the other team?","How do you attribute contributing causes across teams without creating blame?","How do you decide which team owns the fix in a cross-domain incident?"],
      ["Cross-team postmortems with contributing-cause attribution — one per significant incident.","Incident records showing cross-domain diagnosis and fix assignment to the correct team.","Named contacts at each team involved in cross-domain incidents."]),
    p7:L("Leads incident response across the engineering organization as needed. Diagnoses issues across the organization.",
      ["Lead org-wide incident response: declare severity, assign roles, drive to resolution.","Diagnose an issue spanning multiple domains and attribute root causes to each.","Write an org-level postmortem identifying systemic causes — not just immediate triggers.","Run a post-incident review that produces preventive action items with named owners."],
      ["Walk me through an org-wide incident you led. How did you structure the response?","How do you write a postmortem that identifies systemic causes rather than immediate triggers?","How do you ensure post-incident action items are completed and not forgotten?"],
      ["Org-wide incident response records with role assignments and resolution timeline.","Published org-level postmortems identifying systemic causes.","Post-incident action items with completion tracking — verified at next review."]),
  }},
  {id:'observability',label:'Observability',levels:{
    p2:NA,
    p3:L("Is aware of the organization's monitoring philosophy and the operational data for their team's domain.",
      ["Describe what 'normal' looks like on the team's key dashboards — specific metrics and ranges, not general statements.","Orient to an unfamiliar client's monitoring tooling within the engagement ramp-up window.","Identify an anomalous window on a dashboard and describe what it indicates.","Use the team's existing dashboards as the first tool before asking a senior engineer for help."],
      ["Open this dashboard. What does 'normal' look like and how do you know?","Describe how you oriented to an unfamiliar monitoring tool on a client project.","Point to an anomaly on this dashboard. What does it tell you about the system?"],
      ["Can describe baseline metrics for the team's domain without notes.","Evidence of orienting to client monitoring tooling within the ramp-up window.","Incidents where the dashboard was the first tool used — not senior engineer consultation."]),
    p4:L("Helps tune and change the monitoring on their team accordingly. Uses operational data as a basis for suggesting stability and performance improvements.",
      ["Propose a monitoring or alerting change justified by an observed data pattern — not intuition.","Distinguish actionable alerts from informational noise before proposing any change.","Use the client's existing monitoring tooling — do not introduce a new tool without written justification.","Document the observed pattern and the proposed change in a short written proposal."],
      ["Describe a monitoring or alerting change you proposed. What data justified it?","How do you decide whether an alert is actionable or just informational?","Show me how you would use this dashboard to propose a stability improvement."],
      ["Written monitoring or alerting change proposal with data justification.","Alerts configured are actionable — each one requires a specific response from someone.","Monitoring changes use the client's existing tooling — new tool introductions are justified in writing."]),
    p5:L("Drives monitoring work on their team based on the organization's monitoring philosophy. Uses operational data to drive changes to achieve stability and performance improvements.",
      ["Drive a team monitoring change from data: identify the gap, propose the fix, implement it, measure the outcome.","Connect each monitoring change to a stability or performance metric the team tracks.","Use operational data to justify engineering time spent on reliability work.","Report the outcome of a monitoring change in measurable terms — not just 'it helped'."],
      ["Describe a monitoring improvement you drove for your team. What data justified it and what was the measurable outcome?","How do you use operational data to make the case for reliability work over feature work?","How do you measure whether a monitoring change actually improved stability?"],
      ["Monitoring change proposal with before-and-after metric data.","Stability or performance improvement attributable to the monitoring change.","Team dashboard showing improved signal-to-noise ratio after the change."]),
    p6:L("Fosters a culture of observability across several teams and helps them use operational data to improve stability and performance.",
      ["Establish dashboard or alert standards adopted by at least two other teams.","Help each team use their own operational data — do not own their dashboards for them.","Track adoption of the observability standard across teams with a named metric.","Run cross-team observability reviews using shared operational data."],
      ["Describe an observability standard you established across teams. How did you drive adoption?","How do you help a team that does not yet use operational data to drive decisions?","How do you track whether teams are actually using the observability standard?"],
      ["Observability standard document adopted by multiple teams — with adoption dates.","Cross-team observability review records.","Named contacts at each team confirming standard use."]),
    p7:L("Fosters a culture of observability across the engineering organization.",
      ["Define and publish an org-wide observability standard covering logs, metrics, traces, and alert conventions.","Measure team adherence to the standard on a recurring basis.","Hold teams accountable when their observability practice falls below the standard.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide observability standard would you define? How would you enforce it?","How do you measure whether teams are practicing observability — not just installing tooling?","How do you connect the observability standard to engineering delivery outcomes?"],
      ["Published org-wide observability standard — versioned, with review dates.","Adherence measurement report covering all teams — recurring cadence.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'understanding-code',label:'Understanding Code',levels:{
    p2:L("Is able to gain context within team's domain with help from more senior engineers.",
      ["Identify which existing module a piece of new logic belongs in, with guidance.","Ask specific, targeted questions to orient in an unfamiliar codebase — not open-ended walk-throughs.","Check for existing logic before writing a new function — do not duplicate what is already there.","Gain enough context to complete an assigned task within the agreed ramp-up time."],
      ["Look at this codebase. Where would you add this new feature and why?","How do you orient in an unfamiliar codebase? Walk me through your first steps.","How do you check whether the logic you are about to write already exists somewhere?"],
      ["PRs place new logic in the correct existing module — no duplication introduced.","Orientation questions are targeted and specific — not open-ended requests for a full walkthrough.","Assigned tasks completed within the agreed ramp-up window."]),
    p3:L("Understands a portion of the team's domain, can gain sufficient context to work productively in that portion.",
      ["Explain the data flow for a portion of the team's domain to a new teammate — without notes.","Read and follow a new client codebase's architectural conventions within the engagement ramp-up window.","Map the services and data flows relevant to a task before starting implementation.","Gain sufficient context in an assigned domain portion to work without constant guidance."],
      ["Explain the data flow for this part of the domain as if I just joined the team.","Describe how you oriented to a new client codebase on a recent engagement. What did you read first?","How do you decide you have enough context to start working productively on a task?"],
      ["Domain walkthrough or onboarding notes produced for a new teammate.","PRs show correct use of the domain's existing architectural conventions from the start.","Context gathered from code and docs — not primarily from asking teammates."]),
    p4:L("Understands their team's domain at a high level and can gather sufficient context to work productively within it. Has expertise in a portion of their team's domain.",
      ["Scope a moderately complex change across the team's domain using a service map — not just the assigned files.","Describe the team's domain at a high level without notes: services, data flows, key boundaries.","Identify which services are affected by a proposed change before implementation starts.","Demonstrate deep expertise in at least one domain portion through design decisions, review quality, or incident diagnosis."],
      ["Walk me through scoping this change across your team's domain. Which services are affected?","Describe your team's domain at a high level — services, data flows, key boundaries.","In which area of your domain do you have the deepest expertise? How did you build it?"],
      ["Tech specs or design docs include a domain-scope section identifying all affected services.","PRs reflect awareness of domain-wide impact — not just the changed file.","Deep expertise demonstrated in at least one domain portion through review comments or design records."]),
    p5:L("Has expertise in their team's domain, including the breadth of services, how they interact, and data flows between systems. Understands adjacent domains as they affect their team.",
      ["Describe the full breadth of services in the team's domain, including data flows between them.","Name each adjacent domain that affects your team's services and describe how it affects you.","Evaluate the full impact of a proposed change on your domain before it is built.","Explain the domain to a non-technical stakeholder without internal jargon."],
      ["Describe your team's full domain — every service, how they interact, and the key data flows.","Name an adjacent domain that affects your team. How does it affect you and how do you manage that dependency?","How do you use your domain knowledge to catch impact before a change is implemented?"],
      ["Architecture diagram or domain map produced and actively maintained.","Cross-domain impact identified in design reviews or RFCs before the build starts.","Adjacent-domain dependency management documented — with named contacts."]),
    p6:L("Has expertise in a set of related teams' domains, including the breadth of services, how they interact, and data flows between systems.",
      ["Describe the service architecture and data flows across at least two related teams' domains.","Identify cross-domain interaction risks before they cause incidents.","Guide team leads in decisions that respect cross-domain boundaries.","Produce or maintain a cross-team architecture diagram used by all affected teams."],
      ["Describe the domains of the teams you work across — services, data flows, key boundaries.","How have you identified a cross-domain interaction risk before it caused a problem?","How do you help team leads make decisions that respect domain boundaries they do not fully own?"],
      ["Cross-team architecture diagram maintained and used by affected teams.","Cross-domain risks identified and mitigated before incidents — with dates.","RFC or design review comments showing cross-domain boundary guidance."]),
    p7:L("Has expertise in the organization's architecture, including all domains, their bounded contexts, and how they interact with each other.",
      ["Describe the org's full architecture — all domains, bounded contexts, and interaction patterns.","Identify an architectural risk spanning multiple bounded contexts before it causes an incident.","Define and document bounded context boundaries that all teams adopt.","Teach the org's architectural model to engineers and leads on a recurring basis."],
      ["Describe the org's architecture — all domains, bounded contexts, and key interaction patterns.","How do you identify architectural risks that span multiple bounded contexts?","How do you ensure that bounded context boundaries are understood and respected across all teams?"],
      ["Org architecture document describing all domains and bounded contexts — maintained and versioned.","Architectural risks identified and resolved before incidents — with evidence.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'software-arch',label:'Software Architecture',levels:{
    p2:L("Is aware of overall service architecture. Designs basic functions with an awareness of overall service architecture, avoiding duplication across codebases and interface-breaking changes.",
      ["Describe how a new function fits the overall service architecture before writing it.","Check for existing logic before writing a new function — do not duplicate what is already there.","Avoid changing a function's public interface without confirming the downstream impact first.","Place new code in the module that matches its responsibility in the existing architecture."],
      ["Before writing this function, describe where it belongs in the service architecture and why.","How do you check whether logic you are about to write already exists in the codebase?","What would you check before changing a function's signature?"],
      ["No duplicate logic introduced in PRs.","New code placed in the architecturally appropriate module.","Interface-breaking changes flagged and discussed before merge — not after."]),
    p3:L("Designs functions that are aligned with the overall service architecture.",
      ["Design a function interface that aligns with the team's existing architectural patterns, without guidance.","Avoid coupling a new function to implementation details it should not know about.","Name new functions and types consistently with the team's existing naming conventions.","Propose an alternative design when an assigned approach conflicts with the existing architecture."],
      ["Show me a function interface you designed. How did you align it with the team's architectural patterns?","Describe a time you pushed back on an approach because it conflicted with the architecture.","How do you avoid coupling when designing a new function?"],
      ["PRs show function interfaces consistent with the team's architectural patterns.","Design objections raised in review before implementation — not after code is written.","No unnecessary coupling introduced between modules in PRs."]),
    p4:L("Consistently designs code that is aligned with the overall service architecture. Utilizes abstractions and code isolation effectively.",
      ["Design abstractions that match actual variability — do not abstract for speculative future use.","Use dependency injection or inversion of control to isolate testable units.","Deliver a design that fits within a client-mandated stack or platform constraint — do not treat constraints as blockers.","Document the design decision and its rationale in the PR or a linked design doc."],
      ["Walk me through a design decision where you chose an abstraction. How did you know the abstraction level was right?","Describe adapting your design to a client's mandated stack constraint.","How do you decide when to use dependency injection versus a simpler structure?"],
      ["Abstractions in PRs match actual variability — no over-engineered generalization present.","Design docs or PR descriptions explain architectural decisions with rationale.","Client stack constraints accommodated in design — no blockers claimed without alternatives explored."]),
    p5:L("Architects services and systems using well accepted design patterns to allow for iterative, autonomous development and future scaling. Anticipates future use cases and makes design decisions that minimize the cost of future changes.",
      ["Architect a service or system component using a named, accepted design pattern — document why it fits.","Design the first increment to be deployable on its own — not a foundation waiting for later phases.","Negotiate an architectural tradeoff with a client's technical stakeholders and document the outcome.","Flag decisions that are expensive to reverse before the build starts."],
      ["Describe a component you architected. Which design pattern did you use and why?","How do you design so that the first increment ships rather than just lays the groundwork?","Describe negotiating an architectural tradeoff with a client's technical team. What was the outcome?"],
      ["Architecture decision records documenting pattern choice and rationale.","First deliverable increment deployed — not held for a later phase.","Client architectural tradeoff documented with stakeholder agreement on file."]),
    p6:L("Works across teams to foster a culture of architecture that allows for iterative, autonomous development and future scaling. Guides several teams in anticipation of future use cases.",
      ["Guide at least two teams toward a shared architectural pattern — documented and adopted by both.","Identify where one team's architectural decisions create risk or coupling for another team.","Run cross-team architecture reviews using consistent criteria.","Produce and maintain a cross-team architecture decision record accessible to all affected teams."],
      ["Describe a shared architectural pattern you guided multiple teams to adopt. How did you reach alignment?","How do you identify when one team's architecture creates problems for another?","How do you run a cross-team architecture review?"],
      ["Shared architectural pattern document adopted by multiple teams — with adoption dates.","Cross-team architecture review records.","Cross-team ADRs produced and maintained — accessible to all affected teams."]),
    p7:L("Works across the organization to foster a culture of architecture that allows for iterative, autonomous development and future scaling. Guides teams in the organization.",
      ["Define an org-wide architecture principle covering how bounded contexts interact.","Establish an architecture review process that all teams use before making significant structural decisions.","Identify org-wide architectural risks before they cause incidents.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide architecture principles would you define? How would you enforce them?","Describe an org-wide architectural risk you identified before it caused a problem.","How do you run an architecture review process that scales across many teams?"],
      ["Published org-wide architecture principles — versioned, with review dates.","Architecture review process adopted by all teams — with evidence of use.","Architectural risks identified and resolved before incidents — with prevention evidence."]),
  }},
  {id:'security',label:'Security',levels:{
    p2:L("Understands the importance of security.",
      ["Name the security implication of a proposed change in plain language before submitting it for review.","Identify what counts as client IP or client data in the current codebase before handling it.","Escalate any security concern to a senior engineer before acting on it.","Never commit credentials, API keys, or secrets to version control."],
      ["Name a security concern in this proposed change.","What would count as client data in this codebase? How did you identify it?","What do you do if you are unsure whether a change has a security implication?"],
      ["PR descriptions name security considerations before review raises them.","No credentials or secrets committed to version control — verified by pre-commit or review.","Security escalations made before acting — not after a mistake."]),
    p3:L("Understands the importance of security. Asks more senior engineers for help on decisions that may have security implications.",
      ["Flag a security question to a senior engineer before making any decision with unclear security implications.","Handle client credentials only through the client's or LFT's approved secrets-management process — never ad hoc.","Name at least one OWASP-class risk relevant to the code you are reviewing.","Check the client's data-handling terms before moving client data outside the approved environment."],
      ["Describe a time you escalated a security question rather than guessing. What made you uncertain?","How do you handle a client credential you receive for the first time?","Name an OWASP-class risk relevant to this code snippet and explain the specific threat."],
      ["Security escalations with a written trail — made before the decision, not after.","Client credentials handled through approved secrets-management only — no ad hoc sharing.","Code review comments naming specific OWASP-class risks — examples from the review period."]),
    p4:L("Approaches all engineering work with a security lens. Actively looks for security vulnerabilities both in the code and when providing peer reviews.",
      ["Apply a security checklist before implementation to every design that touches authentication, user data or external input.","Identify a specific security vulnerability in a peer review — name the risk class, not just 'this looks risky'.","Identify which client contract or data-handling terms apply to a piece of work before starting.","Propose a specific mitigation for every vulnerability you flag in review."],
      ["Spot vulnerabilities in this code snippet. Name the specific risk class for each.","Which security checklist do you apply before implementing a feature? Walk me through it.","How do you identify which data-handling terms apply to a new piece of client work?"],
      ["Security checklists applied to designs — stored in the design doc or PR.","Code review comments cite specific vulnerability class and a concrete mitigation — not vague warnings.","Client data-handling compliance confirmed before work starts — written record kept."]),
    p5:L("Actively works with the security team and their own team to refine their team's approach to security. Fosters a security-first mindset within their own team.",
      ["Refine the team's security approach jointly with the security team — document the result.","Define a client-engagement-specific security practice acceptable to the client's technical leadership.","Make sure team review catches security issues before production, and the number that escape goes down.","Teach security concepts in context during reviews — not just enforce rules."],
      ["Describe a security practice you refined with the security team. What changed and how was it documented?","Describe a client-specific security constraint you designed around. How did you make it practical for the team?","How do you build a security-first mindset on a team without making security feel like a delivery blocker?"],
      ["Team security practice document produced jointly with the security team.","Client-specific security practice document accepted by the client's technical leadership.","Security issues caught in team review, with the escaped-issue trend."]),
    p6:L("Actively works with the security team and across several teams to apply the organization's security strategy. Fosters a security-first mindset across those teams.",
      ["Apply the org's security strategy consistently across at least two teams — document conflicts and how you resolved them.","Resolve a conflict between two clients' differing security requirements affecting shared LFT tooling.","Train leads on other teams to apply the security standard without your involvement.","Track security issues caught versus escaped across teams per quarter."],
      ["Describe applying the org security strategy across multiple teams. How did you resolve inconsistencies?","Describe resolving a conflict between two clients' security requirements on shared LFT tooling.","How do you train team leads to apply the security standard independently?"],
      ["Cross-team security strategy application records — with conflict resolutions documented.","Client security conflict resolution documented and on file.","Leads trained — before-and-after evidence of independent application."]),
    p7:L("Actively works with the security team to set and refine organization-wide security strategy. Can recognize obscure security threats that go unnoticed to others.",
      ["Set an org-wide security strategy adopted by both the security team and engineering leads.","Identify an obscure security threat that standard review or tooling did not surface.","Document the strategy and its rationale so it survives leadership changes.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org-wide security strategy would you set? How would you get security team and engineering lead adoption?","Describe identifying a non-obvious security threat. How did you catch it when others missed it?","How do you document a security strategy so it remains effective after leadership changes?"],
      ["Published org-wide security strategy — adopted by security team and engineering leads.","Non-obvious threat identified and mitigated — with evidence of how others missed it.","Leads apply it independently — visible in their own teams' decisions and reviews."]),
  }},
  {id:'ai-assisted',label:'AI-Assisted Engineering',levels:{
    p2:L("Knows which AI tools the client approves. Checks AI output before committing, with guidance from a senior engineer. Learns the basics of prompting and follows the team's AI workflow with guidance.",
      ["Review every AI suggestion before committing — read it fully, do not accept blindly.","Confirm the client's approved AI tools before using any AI tool on a client engagement.","Keep each AI session to one clearly defined task.","Describe what a clear prompt contains: task, context, constraints, and expected output."],
      ["Show me a recent AI-assisted PR. Walk me through what the AI suggested and what you changed before committing.","How do you find out which AI tools a client permits on their engagement?","What makes a prompt clear? Give me an example for a specific coding task."],
      ["AI-assisted PRs include a note on what was reviewed and what was changed.","Client-approved AI tools confirmed and documented before any use on client code.","No unapproved AI tools used on client code or data."]),
    p3:L("Understands how to use AI tools safely without guidance. Applies a consistent prompting pattern for recurring tasks. Writes a spec before every non-trivial agent task. Always strips client data from AI tool prompts and keeps AI tasks small and well-defined.",
      ["Apply a consistent prompting pattern for at least one recurring task — document it as a template or skill.","Write a short spec before starting any non-trivial agent task: goal, constraints, and acceptance criteria.","Strip client names, IDs, secrets, and real data from all prompts before sending.","Note AI errors or inappropriate suggestions you catch before committing, so the team learns from them."],
      ["Show me a prompting pattern you use consistently. What task is it for and what does it contain?","Describe writing a spec before an agent task. What went into it?","How do you ensure client data does not appear in your AI tool prompts?"],
      ["Documented prompt pattern used on at least three recent tasks.","Spec committed to repo or linked from PR before agent task begins.","No client data in prompts — confirmed by prompt review log."]),
    p4:L("Understands how AI fits across the full development lifecycle. Integrates AI into coding, testing, debugging, documentation, and review. Owns feature-level specs and context files in the repository. Applies client AI restrictions correctly when moving between engagements, without a reminder. Uses an agentic workflow end to end and shares it so teammates use it too.",
      ["Use AI in all five stages: coding, testing, debugging, documentation and review. At least one PR in the review period shows each.","Keep the project context file current as the project changes.","Run at least one agentic workflow end to end: spec, plan, agent build, tests, review.","Write up the agentic workflow so a teammate can repeat it without you."],
      ["Show PRs where you used AI in each of the five lifecycle stages. Walk me through each.","How do you maintain the project context file? When did you last update it?","Describe running an agentic workflow end to end. What did the spec contain?"],
      ["PRs in the review period showing AI use in each of the five stages.","Project context file committed to repo and updated within the last month.","Agentic workflow write-up used by at least one teammate independently."]),
    p5:L("Understands the team's AI workflow approach. Works with the team to establish a documented AI standard, shared context files, and prompt patterns. Identifies where AI tool use reduces quality or introduces risk, and intervenes before it becomes a delivery problem. Orchestrates AI across PM, Design, QA and DevOps within the project, and builds the team's skill to use it.",
      ["Publish a written team AI standard covering approved tools, spec format, and review rules — reviewed in the last quarter.","Enforce the standard: AI PRs that break it are fixed before merge.","Spot AI quality or risk issues before they reach production.","Track AI-related rework rate and review the trend with the team each cycle."],
      ["Show me the team AI standard you wrote or maintain. Walk me through its key rules.","Describe catching an AI quality or risk issue before it reached production.","How do you measure whether the team's AI practice is improving or degrading?"],
      ["Team AI standard in repo or wiki — reviewed in the last quarter.","AI quality or risk issues caught before production — examples from the review period.","AI rework rate trend reviewed with the team each cycle."]),
    p6:L("Understands the AI workflow approach of several teams. Works with those teams to close practice gaps, using evidence to track improvement. Contributes to org-wide AI workflow standards. Influences org-wide AI tool strategy.",
      ["Drive AI workflow adoption on at least two teams — name a contact and a measurable change for each.","Close at least one practice gap per half-year with before-and-after numbers.","Contribute to the org-wide AI workflow standard — appear in its change history at least once per quarter.","Train at least two leads to run AI enablement on their own teams independently."],
      ["Name the teams where you drove AI workflow adoption. What changed at each?","Describe closing a practice gap across teams. What were the before-and-after numbers?","How have you contributed to the org-wide AI workflow standard?"],
      ["Named contacts and change records for each team where adoption was driven.","Practice gap closure documented with before-and-after metric data.","Change history of org-wide AI standard showing your contributions — at least quarterly."]),
    p7:L("Understands the organisation's AI workflow approach. Uses outcome metrics to identify gaps. Works with all teams to enforce the standard and holds them accountable. Drives org-wide AI workflow strategy, measured by delivery outcomes rather than usage counts.",
      ["Publish a versioned org AI workflow standard — reviewed at least twice a year.","Tie the standard to at least one delivery-outcome metric: lead time, change failure rate, or rework.","Document at least one accountability case per year: which team, what the standard required, the outcome.","Make it stick without you: leads can explain the standard and apply it to their own teams."],
      ["What org AI workflow standard would you set? How would you measure it by outcomes, not usage counts?","Describe holding a team accountable to the AI workflow standard. What happened?","How do you connect AI workflow practice to delivery outcomes for an executive audience?"],
      ["Published org AI workflow standard — versioned, with review dates.","Delivery-outcome metric baseline and quarterly report.","Accountability cases documented — one per year minimum, with outcomes."]),
  }},
  {id:'ai-judgment',label:'AI Engineering',levels:{
    p2:L("Knows the basics of how LLMs work: tokens, context windows, and probabilistic output. Contributes a small part of an AI feature under guidance from a senior engineer. Flags uncertain LLM output before merge.",
      ["Explain why AI output requires verification even when it looks correct at first glance.","Escalate uncertain AI-generated code to a senior engineer before committing.","Identify whether a given AI output is verifiable by testing or requires human judgment.","Name at least one common AI failure mode: hallucination, overconfidence, or context loss."],
      ["Why can you not trust AI output that looks correct? Give me a specific example.","Describe a situation where you escalated uncertain AI-generated code. What made you uncertain?","What is a hallucination in the context of an AI coding tool? Give me a concrete example."],
      ["PRs with uncertain AI output flagged for senior review before merge.","Escalation records for AI-generated code uncertainty.","No uncertain AI output shipped without senior sign-off — confirmed by review history."]),
    p3:L("Understands LLM foundations and applies them without guidance. Builds an LLM-calling component from a given design. Finds failures in own component's output before the PR. Always writes an eval set with normal, edge, and failure cases.",
      ["Name and describe three AI failure modes with a code example for each: hallucination, overconfidence, and context loss.","Identify an incorrect or dangerous AI output in a given code snippet.","Refine a prompt based on its output before accepting the result — document the refinement.","Write a basic eval set of at least five cases covering normal, edge, and failure scenarios."],
      ["Name three AI failure modes. Show me a code example of each.","Show me a prompt you refined based on the output. What changed and why?","Write an eval set for this AI component. What cases would you include?"],
      ["Eval sets written for AI components — at least five cases per component.","Prompt refinement documented in PR descriptions.","AI output errors caught before committing — examples from the review period."]),
    p4:L("Understands the full responsibility of shipping an AI feature. Decides whether a feature needs AI, chooses the simplest AI form, and justifies the choice. Ships with an eval suite and a rollback condition tied to a measurable signal. Explains the feature's behaviour and limits to the team.",
      ["Ship an AI-powered feature (client, internal, or practice project) with a committed eval suite covering normal, edge, and failure cases.","State in writing which failure modes the eval suite covers and which it does not.","Define a rollback condition before shipping: the metric, the threshold, and the named owner.","Justify model, vendor, and region choice with written cost, latency, and quality numbers."],
      ["Describe an AI feature you shipped. Show me the eval suite and explain what it covers and what it misses.","What was the rollback condition for your AI feature? How was it monitored?","Why did you choose this model and vendor? What numbers justified the choice?"],
      ["AI feature with committed eval suite — normal, edge, and failure cases present.","Written statement of which failure modes the eval covers and which it does not.","Rollback condition defined before ship — metric, threshold, and named owner on file."]),
    p5:L("Understands the team's AI engineering approach, and uses eval quality and rollback metrics to identify gaps. Works with the team to set standards for eval design and rollback readiness. Decides where humans belong in the loop across the team's features. Explains probabilistic AI behaviour to non-technical stakeholders.",
      ["Make sure every AI feature PR gets a reviewer who checks prompts, evals, grounding and rollback; review a sample yourself.","Set a team eval standard: minimum case count, failure-mode documentation, and rollback readiness criteria.","Add production AI failures to the eval set within one sprint of discovery.","Produce a one-page feature brief explaining probabilistic behaviour to non-technical stakeholders for each AI feature."],
      ["Show me an AI PR you reviewed. What specific feedback did you give on eval coverage and rollback readiness?","Describe the team eval standard you set. What does it require?","How do you explain AI feature behaviour to a non-technical client stakeholder?"],
      ["AI PR review comments naming specific eval gaps, prompt issues, or rollback concerns.","Team eval standard in repo — with minimum requirements stated explicitly.","Feature briefs produced for non-technical stakeholders — one per shipped AI feature."]),
    p6:L("Understands the AI engineering approach of several teams. Works with those teams to address systemic AI risk patterns and uses quality metrics to track improvement. Sets consistent delivery standards, eval standards, and cost management across teams. Influences org-wide AI engineering strategy.",
      ["Identify at least one systemic AI risk pattern across at least two teams — with named contacts and recurrence data.","Report hallucination rate, cost per request, and rollback readiness consistently across teams every month.","Own AI cost budgets: flag overruns before month end.","Maintain a responsible-AI and compliance checklist used by every AI feature in your scope."],
      ["Describe a systemic AI risk pattern you identified across teams. What was the evidence and how did you address it structurally?","How do you track AI quality and cost across multiple teams on a consistent basis?","Walk me through the responsible-AI checklist you use. What does each item check?"],
      ["Systemic AI risk pattern identified — named contacts, before-and-after recurrence data.","Monthly cross-team AI quality and cost report.","Responsible-AI checklist used by all AI features in scope — reviewed in the last quarter."]),
    p7:L("Understands the organisation's AI capability. Uses outcome metrics to identify gaps. Works with all teams and clients to set realistic targets and improvement roadmaps. Drives org-wide AI governance, measured by business outcomes.",
      ["Define org AI delivery standards tied to a named business-outcome metric.","Require every client AI project to have a realistic target and a named improvement roadmap owner.","Produce a written statement per client AI project of what AI can and cannot deliver — agreed with the client.","Publish a quarterly report linking AI strategy to business outcomes."],
      ["What org AI delivery standards would you set? How would you tie them to business outcomes?","How do you set realistic AI capability targets with clients who have inflated expectations?","Describe producing a quarterly AI-strategy-to-business-outcome report. What did it show?"],
      ["Org AI delivery standards tied to business-outcome metrics — published and versioned.","Client AI project plans with realistic targets and named roadmap owners.","Quarterly business-outcome report with AI strategy linkage."]),
  }},
  {id:'ai-security',label:'AI Security Engineering',levels:{
    p2:L("Knows that AI features add a security risk surface that standard code does not have. Never puts secrets or client data into a shipped AI feature. Escalates AI security decisions to senior engineers — does not resolve them alone.",
      ["Confirm the client's approved AI tools and model providers before any AI feature uses them.","Keep secrets, credentials, and client data out of prompts, templates, logs, and eval data.","Escalate any AI security question to a senior engineer the same day — do not resolve it alone.","Describe in two sentences why AI input is riskier than standard form input."],
      ["Why is input to an AI model riskier than input to a standard form? Give me a specific example.","What would you check before sending any data to an AI model on a client engagement?","Describe escalating an AI security concern. What made you uncertain?"],
      ["Client-approved AI tools confirmed and documented before AI feature development starts.","No secrets or client data in prompts, templates, logs, or eval data — confirmed by review.","AI security escalations made the same day with a written trail."]),
    p3:L("Understands the three primary AI-specific security risks: prompt injection, data exfiltration through model context, and insecure third-party model API handling. Identifies each by name and by example in code and design. Follows each client's rules before building an AI feature. Escalates security decisions independently.",
      ["Name and describe prompt injection, data exfiltration through model context, and insecure model API handling — each with a code example.","Identify the injection vector in a code snippet where user or retrieved content enters the prompt.","Note every injection vector in the PR description: user input, retrieved content, and tool output.","Re-check the client's AI rules at the start of each engagement and keep a written record."],
      ["Name the three primary AI security risks. Show me a code example of each.","Point to the injection vector in this code snippet. Where does untrusted content enter the prompt?","How do you check and record which AI rules apply at the start of a new client engagement?"],
      ["PR descriptions note injection vectors considered — user input, retrieved content, tool output.","Client AI rule check at engagement start — written record kept.","Code examples of all three primary AI risks prepared and explainable on demand."]),
    p4:L("Understands the security implications of every AI feature they build. Applies a security lens to injection vectors, context data exposure, and tool permissions. Explains each primary AI security risk and why a design is risky to the team and in peer review. Configures agent autonomy safely.",
      ["Validate or sanitise user input, retrieved content, and tool output before it enters model context.","Assign a written permission scope to every tool and MCP server — broad scopes require a written justification.","Require human approval for delete, push, and infrastructure commands in every agent config.","Check retrieved and tool content for indirect injection in every PR where it applies."],
      ["Show me an AI feature PR. Where do you validate or sanitise content before it enters the model?","How do you scope tool permissions in an agent config? What counts as too broad?","Describe catching an indirect injection vector in a PR review. What did you find?"],
      ["AI feature PRs show validation or sanitisation of all content entering model context.","Tool permission scopes documented — broad scopes carry a written justification.","AI PR review comments naming the injection vector and mitigation — examples from the review period."]),
    p5:L("Understands the team's AI security approach. Works with the team to establish a standard that covers all four first-class concerns. Threat-models the team's AI features for common attack patterns. Reviews teammates' AI work with AI-specific security judgment.",
